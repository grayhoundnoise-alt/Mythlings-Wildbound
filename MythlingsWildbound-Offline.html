<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mythlings: Wildbound</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
<style>
/* ===== MYTHLINGS: WILDBOUND — UI theme ===== */
:root {
  --gold: #f2c761;
  --gold-dark: #a37a24;
  --panel: linear-gradient(180deg, rgba(23,38,56,0.96), rgba(13,22,36,0.97));
  --panel-light: linear-gradient(180deg, rgba(38,58,82,0.95), rgba(22,36,54,0.96));
  --nature: #4fc76a;
  --water: #3fa9f5;
  --fire: #ff7a3d;
  --text: #eaf3ff;
  --muted: #9fb3c9;
  --danger: #ff6b6b;
  --ok: #6de89a;
  --radius: 16px;
  --shadow: 0 12px 34px rgba(0,0,0,0.45);
  font-size: 16px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #060b12; color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  user-select: none; -webkit-user-select: none;
}
#app { position: fixed; inset: 0; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }

button { font-family: inherit; cursor: pointer; }

/* ---------- Panels & buttons ---------- */
.panel {
  background: var(--panel);
  border: 2px solid rgba(242,199,97,0.45);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
}
.panel-light { background: var(--panel-light); }

.btn {
  position: relative;
  padding: 12px 22px;
  border-radius: 12px;
  border: 2px solid rgba(242,199,97,0.5);
  background: linear-gradient(180deg, #2c4460, #16273c);
  color: var(--text);
  font-size: 1rem; font-weight: 700; letter-spacing: 0.04em;
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  box-shadow: 0 5px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 7px 0 rgba(0,0,0,0.35), 0 0 18px rgba(242,199,97,0.35); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.6); transform: none; }
.btn.primary { background: linear-gradient(180deg, #d8a23e, #a5701c); border-color: #ffe29a; color: #23180a; }
.btn.danger { background: linear-gradient(180deg, #b34848, #7e2a2a); border-color: #ff9d9d; }
.btn.ghost { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); }
.btn.small { padding: 7px 13px; font-size: .85rem; border-radius: 9px; }
.btn.wide { width: 100%; }

.title-font {
  font-family: "Trebuchet MS", Georgia, serif;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(12px);} to { opacity:1; transform: none; } }
.screen-inner { animation: popIn .28s ease; }

/* ---------- Main menu ---------- */
/* the title vista is painted on the shared #game canvas behind this overlay */

.menu-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  outline: none;
}

.menu-column {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: clamp(10px, 1.6vh, 22px);
  padding-left: clamp(26px, 6vw, 118px);
  width: min(560px, 46vw);
  animation: menuRise .6s cubic-bezier(.16,.84,.34,1) both;
}
@keyframes menuRise { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }

/* --- logo --- */
.logo-wrap { width: 100%; filter: drop-shadow(0 14px 26px rgba(2,10,22,.55)); }
.logo-svg { width: 100%; height: auto; display: block; overflow: visible; }
.logo-text {
  font-family: "Trebuchet MS", "Gill Sans", Georgia, serif;
  font-size: 92px; font-weight: 900; letter-spacing: 2px; paint-order: stroke fill;
}
.logo-subtext {
  font-family: "Trebuchet MS", "Gill Sans", Georgia, serif;
  font-size: 34px; font-weight: 800; letter-spacing: 13px;
}
.logo-crest { animation: crestFloat 5.5s ease-in-out infinite; transform-origin: 360px 62px; }
@keyframes crestFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-5px) scale(1.015); }
}
.logo-main  { animation: logoSheen 7s ease-in-out infinite; }
@keyframes logoSheen {
  0%, 100% { filter: url(#lg-soft) drop-shadow(0 0 0 rgba(140,220,255,0)); }
  50%      { filter: url(#lg-soft) drop-shadow(0 0 18px rgba(140,220,255,.55)); }
}

.menu-tagline {
  font-family: "Trebuchet MS", Georgia, serif;
  font-size: clamp(.78rem, 1.35vw, 1.05rem);
  letter-spacing: .42em; text-transform: uppercase;
  color: #d7ecff; text-shadow: 0 2px 10px rgba(0,0,0,.8);
  padding-left: 6px; opacity: .95;
}

/* --- buttons --- */
.menu-buttons {
  display: flex; flex-direction: column; gap: clamp(8px, 1.3vh, 14px);
  width: 100%; margin-top: clamp(6px, 1.4vh, 18px);
}
.menu-btn {
  --accent: #7fd6ff;
  position: relative; display: flex; align-items: center; gap: 14px;
  width: 100%; padding: clamp(10px, 1.5vh, 16px) 20px;
  border-radius: 14px; cursor: pointer; overflow: hidden;
  border: 1.5px solid rgba(150,196,236,.34);
  background:
    linear-gradient(180deg, rgba(30,54,85,.94), rgba(11,24,42,.96));
  box-shadow: 0 8px 20px rgba(3,10,20,.5), inset 0 1px 0 rgba(255,255,255,.14);
  color: #dce9f8; text-align: left;
  transition: transform .16s cubic-bezier(.2,.9,.3,1.3), box-shadow .16s ease,
              border-color .16s ease, background .16s ease;
}
/* sliding sheen */
.menu-btn::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent);
  transform: skewX(-18deg); opacity: 0; transition: opacity .2s ease;
}
.menu-btn:hover::after, .menu-btn.selected::after { opacity: 1; animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { 0% { left: -60%; } 70%, 100% { left: 120%; } }

.menu-btn .mb-ico {
  display: grid; place-items: center; flex: 0 0 auto;
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(180deg, rgba(126,200,246,.22), rgba(40,86,132,.32));
  border: 1px solid rgba(160,214,255,.3);
  color: var(--accent);
  transition: color .16s ease, background .16s ease, transform .16s ease;
}
.menu-btn .mb-ico .ico { width: 20px; height: 20px; }
.menu-btn .mb-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.menu-btn .mb-label {
  font-family: "Trebuchet MS", Georgia, serif;
  font-size: clamp(1rem, 1.5vw, 1.24rem); font-weight: 800; letter-spacing: .16em;
}
.menu-btn .mb-hint {
  font-size: clamp(.64rem, .9vw, .76rem); letter-spacing: .1em;
  color: #92b1cd; text-transform: uppercase;
}
.menu-btn .mb-arrow { color: rgba(160,200,236,.45); display: grid; place-items: center; transition: .16s ease; }
.menu-btn .mb-arrow .ico { width: 16px; height: 16px; }

.menu-btn:hover, .menu-btn.selected {
  transform: translateX(10px) scale(1.022);
  border-color: rgba(190,236,255,.8);
  background: linear-gradient(180deg, rgba(46,86,130,.96), rgba(16,38,64,.97));
  box-shadow: 0 10px 26px rgba(3,10,20,.55), 0 0 26px rgba(110,200,255,.32),
              inset 0 1px 0 rgba(255,255,255,.22);
}
.menu-btn:hover .mb-arrow, .menu-btn.selected .mb-arrow { color: var(--accent); transform: translateX(4px); }
.menu-btn:hover .mb-ico, .menu-btn.selected .mb-ico { transform: scale(1.06); background: linear-gradient(180deg, rgba(150,220,255,.32), rgba(48,102,156,.4)); }
.menu-btn:active { transform: translateX(6px) scale(.995); }

/* the highlighted entry gets a gold-on-cyan treatment */
.menu-btn.primary { --accent: #ffd979; border-color: rgba(242,199,97,.55); }
.menu-btn.primary .mb-ico { background: linear-gradient(180deg, rgba(255,210,110,.28), rgba(150,96,20,.32)); border-color: rgba(255,222,140,.45); }
.menu-btn.primary.selected, .menu-btn.primary:hover {
  border-color: #ffe6a6;
  background: linear-gradient(180deg, rgba(74,104,62,0) 0%, rgba(38,74,116,.97) 100%),
              linear-gradient(180deg, rgba(56,100,146,.96), rgba(18,42,70,.97));
  box-shadow: 0 10px 26px rgba(3,10,20,.55), 0 0 30px rgba(255,206,110,.4),
              inset 0 1px 0 rgba(255,255,255,.26);
}
/* selection caret */
.menu-btn::before {
  content: ''; position: absolute; left: 0; top: 12%; bottom: 12%; width: 4px;
  border-radius: 0 4px 4px 0; background: var(--accent);
  opacity: 0; transform: scaleY(.4); transition: .16s ease;
}
.menu-btn:hover::before, .menu-btn.selected::before { opacity: 1; transform: scaleY(1); box-shadow: 0 0 14px var(--accent); }

/* --- corners --- */
.menu-footnote {
  position: absolute; bottom: 16px; left: clamp(26px, 6vw, 118px);
  color: #9db6cf; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}
.version-block {
  position: absolute; bottom: 14px; right: 20px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  color: #a9c1d8; font-size: .72rem; letter-spacing: .1em; opacity: .72;
  text-shadow: 0 2px 8px rgba(0,0,0,.75);
}
.version-block span:first-child { color: #d9ebff; font-weight: 700; letter-spacing: .18em; }

@media (max-width: 1400px) {
  .menu-column { width: min(468px, 41vw); padding-left: clamp(22px, 4.5vw, 70px); }
  .menu-footnote { left: clamp(22px, 4.5vw, 70px); }
}
@media (max-width: 900px) {
  .menu-column { width: min(92vw, 520px); padding-left: clamp(18px, 5vw, 40px); }
  .menu-btn .mb-hint { display: none; }
}
@media (max-height: 720px) {
  .logo-wrap { width: 84%; }
  .menu-btn { padding: 9px 16px; }
}

/* ---------- Generic dialog / forms ---------- */
.dialog {
  width: min(880px, 94vw); max-height: 92vh; overflow: auto;
  padding: 26px 30px;
}
.dialog h2 { margin: 0 0 6px; font-size: 1.7rem; letter-spacing: .08em; color: var(--gold); text-transform: uppercase; }
.dialog h3 { margin: 18px 0 8px; font-size: 1.05rem; color: #cfe0f2; letter-spacing: .06em; }
.dialog p.sub { margin: 0 0 18px; color: var(--muted); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

input[type="text"] {
  width: 100%; padding: 14px 16px; font-size: 1.3rem; letter-spacing: .18em;
  background: rgba(8,16,26,0.85); border: 2px solid rgba(242,199,97,0.45);
  border-radius: 12px; color: #fff; font-family: inherit; text-transform: uppercase;
}
input[type="range"] { width: 200px; accent-color: var(--gold); }
select {
  padding: 8px 12px; border-radius: 9px; background: #16273c; color: var(--text);
  border: 1px solid rgba(255,255,255,0.2); font-family: inherit;
}

/* ---------- Save slots ---------- */
.slot-list { display: flex; flex-direction: column; gap: 14px; }
.slot {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px; border-radius: 14px; cursor: pointer;
  background: linear-gradient(180deg, rgba(40,62,88,.9), rgba(20,33,50,.92));
  border: 2px solid rgba(255,255,255,0.12);
  transition: .15s;
}
.slot:hover { border-color: var(--gold); transform: translateX(4px); }
.slot .slot-no { font-size: 1.5rem; font-weight: 900; color: var(--gold); min-width: 46px; }
.slot .slot-main { flex: 1; }
.slot .slot-name { font-size: 1.15rem; font-weight: 800; letter-spacing: .06em; }
.slot .slot-meta { color: var(--muted); font-size: .88rem; }
.slot.empty .slot-name { color: #6f8399; font-style: italic; letter-spacing: .2em; }
.slot .slot-portrait { width: 64px; height: 64px; border-radius: 12px; background: rgba(0,0,0,.3); }

/* ---------- Starter selection ---------- */
.starter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 780px) { .starter-grid { grid-template-columns: 1fr; } }
.starter-card {
  padding: 14px; border-radius: 16px; cursor: pointer; text-align: center;
  background: linear-gradient(180deg, rgba(32,52,74,.94), rgba(16,28,44,.96));
  border: 2px solid rgba(255,255,255,0.12); transition: .18s;
}
.starter-card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.starter-card.selected { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,199,97,.35), 0 12px 30px rgba(0,0,0,.55); }
.starter-card canvas { width: 100%; height: 190px; display: block; cursor: grab; }
.starter-card h3 { margin: 6px 0 2px; font-size: 1.3rem; letter-spacing: .1em; }
.starter-card .role { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.stat-mini { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 10px; font-size: .8rem; text-align: left; }
.stat-mini span { color: var(--muted); }
.stat-mini b { float: right; color: #fff; }

/* ---------- Tag chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
}
.chip.nature { background: rgba(79,199,106,.22); border-color: var(--nature); color: #b9ffd0; }
.chip.water  { background: rgba(63,169,245,.22); border-color: var(--water);  color: #bfe9ff; }
.chip.fire   { background: rgba(255,122,61,.22); border-color: var(--fire);   color: #ffd8bd; }
.chip.rarity { color: #fff; }
.chip.shiny  { background: rgba(255,230,128,.2); border-color: #ffe680; color: #fff6cf; }
.chip.darkness { background: rgba(176,124,255,.2); border-color: #b07cff; color: #e9dcff; }
.chip.max { background: rgba(242,199,97,.25); border-color: var(--gold); color: #fff0c4; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.hud > div { position: absolute; pointer-events: auto; }
.hud-topleft { top: 14px; left: 14px; }
.hud-topright { top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hud-bottomleft { bottom: 16px; left: 14px; display: flex; flex-direction: column; gap: 8px; }
.hud-bottomright { bottom: 16px; right: 14px; display: flex; gap: 10px; }

.party-strip { display: flex; gap: 8px; }
.party-chip {
  width: 92px; padding: 6px; border-radius: 12px;
  background: rgba(10,18,30,0.75); border: 1.5px solid rgba(255,255,255,0.14);
  text-align: center; font-size: .72rem; backdrop-filter: blur(4px);
}
.party-chip canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; }
.party-chip .pc-name { font-weight: 800; font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.party-chip .pc-lv { color: var(--muted); font-size: .68rem; }
.party-chip.fainted { filter: grayscale(1) brightness(.6); }
.bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,0.5); overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; border-radius: 4px; transition: width .3s ease; }
.bar.hp > i { background: linear-gradient(90deg, #5ef08a, #2fbf6b); }
.bar.hp.low > i { background: linear-gradient(90deg, #ffd166, #ff9f1c); }
.bar.hp.crit > i { background: linear-gradient(90deg, #ff6b6b, #c92a2a); }
.bar.exp > i { background: linear-gradient(90deg, #7fd8ff, #3fa9f5); }
.bar.ult > i { background: linear-gradient(90deg, #ffd76a, #ff8a3d); }

.coin-pill, .location-pill, .hint-pill, .objective-pill {
  padding: 7px 14px; border-radius: 999px; font-size: .85rem; font-weight: 700;
  background: rgba(10,18,30,0.78); border: 1.5px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(4px);
}
.coin-pill { color: #ffe08a; display: flex; gap: 6px; align-items: center; }
.location-pill { color: #cfe6ff; }
.hint-pill { color: #9fb3c9; font-weight: 600; font-size: .78rem; }
.objective-pill { color: #ffe08a; display: none; }
.objective-pill.show { display: block; }
.minimap { border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(8,14,24,0.8); }

.round-btn {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(180deg, #2c4460, #16273c);
  border: 2px solid rgba(242,199,97,0.55); color: #ffe9b0;
  font-size: 1.3rem; font-weight: 900;
  box-shadow: 0 5px 0 rgba(0,0,0,.4);
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.4); }

.joystick {
  position: absolute; bottom: 90px; left: 24px; width: 120px; height: 120px;
  border-radius: 50%; background: rgba(10,18,30,.4); border: 2px solid rgba(255,255,255,.2);
}
.joystick-knob {
  position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%;
  background: rgba(242,199,97,.65);
}

/* ---------- Dialogue ---------- */
.dialogue { position: absolute; inset: auto 0 0 0; z-index: 30; display: flex; justify-content: center; padding: 0 16px 24px; pointer-events: auto; }
.dialogue-box { width: min(900px, 96vw); padding: 18px 24px 30px; position: relative; }
.dialogue-name { color: var(--gold); font-weight: 900; letter-spacing: .08em; margin-bottom: 6px; text-transform: uppercase; }
.dialogue-text { font-size: 1.1rem; line-height: 1.55; min-height: 3.2em; }
.dialogue-next { position: absolute; right: 18px; bottom: 8px; color: var(--muted); font-size: .8rem; animation: blink 1.1s infinite; }
@keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

/* ---------- Toasts ---------- */
.toast-layer { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  padding: 10px 20px; border-radius: 999px; font-weight: 800; letter-spacing: .04em;
  background: rgba(8,16,28,0.92); border: 1.5px solid var(--gold); color: #ffeab8;
  box-shadow: var(--shadow); animation: toastIn .25s ease;
}
.toast.ok { border-color: var(--ok); color: #cffae0; }
.toast.bad { border-color: var(--danger); color: #ffd6d6; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px);} to { opacity:1; transform:none; } }

/* ---------- Modal ---------- */
.modal-layer {
  position: absolute; inset: 0; z-index: 80;
  background: rgba(3,8,14,0.72);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal { width: min(560px, 94vw); padding: 24px 26px; }
.modal h3 { margin: 0 0 10px; color: var(--gold); letter-spacing: .06em; font-size: 1.25rem; }
.modal p { margin: 0 0 18px; line-height: 1.5; color: #dce9f7; }

/* ---------- Battle ---------- */
.battle-ui { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
.battle-ui > * { pointer-events: auto; }
.combatant-card {
  position: absolute; width: min(330px, 42vw); padding: 10px 14px; border-radius: 14px;
  background: rgba(8,16,28,0.86); border: 2px solid rgba(255,255,255,0.16);
  backdrop-filter: blur(4px); box-shadow: var(--shadow);
}
.combatant-card.enemy { top: 18px; left: 18px; }
@media (max-width: 1100px) {
  .battle-log.top { top: 10px; width: min(560px, 86vw); }
  .combatant-card.enemy { top: 132px; }
}
.combatant-card.player { bottom: 210px; right: 18px; }
.cc-top { display: flex; align-items: center; gap: 8px; }
.cc-name { font-weight: 900; letter-spacing: .04em; font-size: 1.02rem; }
.cc-lv { color: var(--gold); font-weight: 800; margin-left: auto; font-size: .95rem; }
.cc-hp-text { font-size: .78rem; color: var(--muted); text-align: right; }
.ult-track { display: flex; gap: 3px; margin-top: 6px; align-items: center; }
.ult-pip { flex: 1; height: 7px; border-radius: 3px; background: rgba(255,255,255,0.14); }
.ult-pip.on { background: linear-gradient(90deg, #ffd76a, #ff8a3d); box-shadow: 0 0 8px rgba(255,170,60,.8); }
.ult-label { font-size: .7rem; color: var(--muted); letter-spacing: .1em; }
.ult-label.ready { color: #ffd76a; animation: blink 0.8s infinite; }

.battle-log {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: min(660px, 54vw); max-height: 124px; overflow: hidden;
  padding: 10px 18px; border-radius: 14px;
  background: rgba(6,12,22,0.9); border: 1.5px solid rgba(255,255,255,0.16);
  box-shadow: var(--shadow); font-size: .95rem; line-height: 1.45; text-align: center;
}
/* Announcements live at the TOP of the battle screen so both Mythlings stay visible. */
.battle-log.top { top: 16px; bottom: auto; }
.battle-log div { animation: logIn .22s ease; }
@keyframes logIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.battle-log .emph { color: var(--gold); font-weight: 800; }

.battle-actions {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px;
  width: min(940px, 96vw); padding: 12px; display: grid; gap: 10px;
  grid-template-columns: repeat(4, 1fr);
}
.battle-actions .btn { padding: 13px 8px; font-size: .95rem; }
.action-btn { position: relative; text-align: center; }
.action-btn small { display: block; font-weight: 600; font-size: .7rem; color: #a9c0d6; margin-top: 3px; letter-spacing: .02em; }
.action-btn.normal { border-color: #9fb3c9; }
.action-btn.special { border-color: #7fd8ff; }
.action-btn.buff { border-color: #b6f09b; }
.action-btn.debuff { border-color: #ff9aa2; }
.action-btn.empty { opacity: .55; border-style: dashed; }
/* the 1 / 2 / 3 badge: battle buttons, Skill Library loadout and detail panel */
.slot-badge {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; flex: none;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
  font-size: .72rem; font-weight: 900; color: #fff; letter-spacing: 0;
}
.slot-badge.dim { opacity: .4; }
.slot-badge.gold { background: rgba(242,199,97,.22); border-color: var(--gold); color: var(--gold); }
.action-btn.ultimate { border-color: #ffd76a; }
.action-btn.ultimate.ready { background: linear-gradient(180deg, #d8a23e, #a5701c); color: #241804; animation: pulseGlow 1.1s infinite; }
@keyframes pulseGlow { 0%,100% { box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 12px rgba(255,200,90,.5);} 50% { box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 28px rgba(255,200,90,.95);} }
.ult-fill { position: absolute; inset: auto 0 0 0; height: 4px; background: linear-gradient(90deg,#ffd76a,#ff8a3d); border-radius: 0 0 9px 9px; transition: width .3s; }

.dmg-float {
  position: absolute; font-weight: 900; font-size: 1.6rem; pointer-events: none;
  text-shadow: 0 2px 0 rgba(0,0,0,.6); animation: floatUp 1.05s ease-out forwards;
}
@keyframes floatUp { 0% { opacity: 0; transform: translateY(6px) scale(.8);} 20% { opacity:1; transform: translateY(-6px) scale(1.15);} 100% { opacity: 0; transform: translateY(-58px) scale(1);} }

/* ---------- Menus (party / bag / etc.) ---------- */
.menu-screen { width: min(1120px, 96vw); height: min(760px, 92vh); display: flex; overflow: hidden; }
.menu-tabs { width: 210px; padding: 18px 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(6,12,22,0.55); border-right: 2px solid rgba(242,199,97,0.25); }
.menu-tab {
  padding: 11px 14px; border-radius: 10px; border: none; text-align: left;
  background: transparent; color: #bfd3e8; font-weight: 700; letter-spacing: .06em; font-size: .95rem;
}
.menu-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
.menu-tab.active { background: linear-gradient(90deg, rgba(242,199,97,.28), transparent); color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
.menu-body { flex: 1; padding: 20px 24px; overflow: auto; }
.menu-body h2 { margin: 0 0 14px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; font-size: 1.3rem; }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.myth-card {
  display: flex; gap: 10px; padding: 10px; border-radius: 14px; cursor: pointer;
  background: linear-gradient(180deg, rgba(34,54,78,.9), rgba(17,29,45,.94));
  border: 1.5px solid rgba(255,255,255,0.12); transition: .15s;
}
.myth-card:hover { border-color: var(--gold); transform: translateY(-3px); }
.myth-card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242,199,97,.3); }
.myth-card canvas { width: 66px; height: 66px; flex: none; }
.myth-card .mc-main { flex: 1; min-width: 0; }
.myth-card .mc-name { font-weight: 800; font-size: .98rem; display: flex; gap: 6px; align-items: center; }
.myth-card .mc-sub { color: var(--muted); font-size: .78rem; margin: 2px 0 4px; }
.myth-card.fainted { filter: grayscale(.85) brightness(.75); }

.detail-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
@media (max-width: 860px) { .detail-wrap { grid-template-columns: 1fr; } }
.detail-art { border-radius: 16px; background: radial-gradient(circle at 50% 60%, rgba(90,140,190,.35), rgba(8,14,24,.7)); padding: 10px; }
.detail-art canvas { width: 100%; height: 230px; display: block; }
.stat-rows { display: flex; flex-direction: column; gap: 6px; }
.stat-row { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 10px; font-size: .9rem; }
.stat-row .sbar { height: 9px; border-radius: 5px; background: rgba(0,0,0,.45); overflow: hidden; }
.stat-row .sbar > i { display: block; height: 100%; background: linear-gradient(90deg, #7fd8ff, #3fa9f5); }
.stat-row b { text-align: right; }
.stat-row.up b { color: var(--ok); }
.stat-row.down b { color: var(--danger); }

.skill-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 7px;
}
.skill-row .sk-name { font-weight: 800; }
.skill-row .sk-meta { color: var(--muted); font-size: .8rem; }
.skill-row.equipped { border-color: var(--gold); background: rgba(242,199,97,.1); }

.item-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;
}
.item-row .ir-main { flex: 1; }
.item-row .ir-name { font-weight: 800; }
.item-row .ir-desc { color: var(--muted); font-size: .82rem; }
.item-row .ir-qty { color: var(--gold); font-weight: 800; }

.collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
.col-card { padding: 10px; text-align: center; border-radius: 14px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.1); }
.col-card canvas { width: 100%; height: 90px; }
.col-card.unknown canvas { filter: brightness(0) opacity(.45); }
.col-card .cc-name { font-weight: 800; margin-top: 4px; }
.col-card .cc-status { font-size: .75rem; color: var(--muted); }
.col-card.caught { border-color: var(--ok); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters select, .filters input { font-size: .85rem; }

.shop-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
@media (max-width: 800px) { .shop-grid { grid-template-columns: 1fr; } }
.shop-cart { padding: 16px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.12); height: fit-content; }
.qty-ctl { display: flex; align-items: center; gap: 8px; }
.qty-ctl button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #1d3049; color: #fff; font-weight: 900; }

/* ---------- Evolution / cinematic overlays ---------- */
.cinematic {
  position: absolute; inset: 0; z-index: 70; display: flex;
  overflow-y: auto; overflow-x: hidden;
  background: radial-gradient(ellipse at center, rgba(20,40,70,.9), rgba(2,5,10,.98));
}
/* A single `margin:auto` child: centres the cinematic but still scrolls
   instead of clipping when the content is taller than the window. */
.cinematic-stage {
  margin: auto; width: min(760px, 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 28px 18px;
}
/* skill learn-level line in the wiki */
.wiki-learn { color: var(--gold); font-size: .78rem; letter-spacing: .04em; }

/* ---------- Mythling Index: every species with all four forms ---------- */
.index-list { display: flex; flex-direction: column; gap: 14px; }
.index-card {
  padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.1);
}
.index-card.locked { opacity: .75; }
.index-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.index-head .role { color: var(--muted); font-size: .8rem; }
.index-stages { display: flex; gap: 10px; flex-wrap: wrap; }
.index-stage {
  width: 108px; padding: 6px; text-align: center; border-radius: 10px;
  background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.08);
}
.index-stage canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; }
.index-stage .is-name { font-weight: 800; font-size: .78rem; margin-top: 4px; }
.index-stage .is-lv { color: var(--muted); font-size: .7rem; }
.index-stage .is-tag { color: var(--gold); font-size: .62rem; letter-spacing: .06em; margin-top: 2px; }
.index-stage.locked { opacity: .5; }
.index-blank {
  width: 100%; aspect-ratio: 1 / 1; display: grid; place-items: center;
  color: var(--muted); font-size: 2rem; background: rgba(255,255,255,.04); border-radius: 8px;
}

/* Square at every size: the canvas used to be stretched wide and short, which
   squashed the Mythling. JS backs it at device resolution for sharpness. */
.cinematic canvas {
  display: block; width: min(460px, 82vw, 56vh); height: auto; aspect-ratio: 1 / 1;
}
/* Once the summary appears, give the text room instead of overflowing. The
   Mythling stands at ~72% of the square, so the empty bottom band is cropped
   (the JS backs the canvas at the same ratio): "Congratulations!" sits right
   under the evolved Mythling instead of a hand's width below it. */
.cinematic.done canvas { width: min(300px, 46vh, 60vw); aspect-ratio: 460 / 356; }
.cinematic.done .cinematic-stage { gap: 10px; }
.cinematic.done h2 { margin: 0; }
.cinematic.done p { margin: 0; }
.cinematic h2 { font-size: clamp(1.4rem,4vw,2.4rem); letter-spacing: .12em; color: var(--gold); text-align:center; text-shadow: 0 0 22px rgba(255,200,90,.6); }
.cinematic p { color: #dce9f7; font-size: 1.05rem; text-align: center; max-width: 620px; }

.fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 90; }
.fade.on { opacity: 1; }

.levelup-list { display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.levelup-list .gain { color: var(--ok); }
/* Skill Library: EQUIP / UNEQUIP per skill, loadout strip on top */
.skill-slots { display: flex; gap: 4px; flex: none; }
.skill-slots .btn { min-width: 30px; padding: 5px 8px; }
.loadout-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.loadout-slot {
  padding: 10px 12px; border-radius: 12px; min-height: 92px;
  background: rgba(255,255,255,.05); border: 1.5px dashed rgba(255,255,255,.18);
}
.loadout-slot.filled { border-style: solid; border-color: var(--gold); background: rgba(242,199,97,.08); }
.loadout-slot.filled.special { border-color: #7fd8ff; }
.loadout-slot.filled.buff { border-color: #b6f09b; }
.loadout-slot.filled.debuff { border-color: #ff9aa2; }
.loadout-slot .ls-head { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.loadout-slot .ls-name .ico { width: 15px; height: 15px; vertical-align: -.15em; }
.loadout-slot .ls-meta { color: var(--muted); font-size: .76rem; margin-top: 4px; }
.loadout-slot.empty .ls-name { color: var(--muted); font-weight: 600; }
.lib-level { color: var(--gold); font-size: .78rem; letter-spacing: .08em; font-weight: 800; margin: 12px 0 6px; }
.cat-tag {
  display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: middle;
  font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800;
  background: rgba(255,255,255,.1); color: #dce9f7;
}
.cat-tag.special { background: rgba(127,216,255,.18); color: #bfe9ff; }
.cat-tag.buff { background: rgba(182,240,155,.18); color: #d9ffc7; }
.cat-tag.debuff { background: rgba(255,154,162,.2); color: #ffc4c9; }
/* feed-a-stack quantity picker */
.qty-picker { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.qty-picker .qty-value { min-width: 64px; text-align: center; font-size: 1.6rem; color: var(--gold); }
.feed-preview { text-align: center; line-height: 1.5; }
@media (max-width: 640px) { .loadout-strip { grid-template-columns: 1fr; } }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,.25); border-radius: 6px; }
::-webkit-scrollbar-thumb { background: rgba(242,199,97,.4); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(242,199,97,.65); }

@media (max-width: 720px) {
  .combatant-card { width: 48vw; }
  .combatant-card.player { bottom: 250px; }
  .battle-actions { grid-template-columns: repeat(2, 1fr); }
  .battle-log { bottom: 236px; }
  .party-chip { width: 66px; }
  .menu-tabs { width: 120px; }
}


/* ================= Icons & unified panel chrome ================= */
.ico {
  width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -0.16em;
  fill: currentColor; flex: none;
}
.ico.tiny { width: .95em; height: .95em; }
.ico.gold { color: var(--gold); }
.ico.good { color: var(--ok); }
.ico.nature { color: #6fe08a; }
.ico.water  { color: #6fc9ff; }
.ico.fire   { color: #ff9a55; }
.ico-label { display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
.ico-wrap { display: inline-flex; }
.item-ico { width: 22px; height: 22px; color: var(--gold); opacity: .85; }
.stat-name { display: inline-flex; align-items: center; gap: 5px; }
.stat-row.up .ico { color: var(--ok); }
.stat-row.down .ico { color: var(--danger); }
.chip .ico { width: .9em; height: .9em; margin-right: 4px; }
.chip.evolve { border-color: #ffd76a; color: #ffd76a; }
.coin-line { display: flex; align-items: center; gap: 6px; }
.ir-qty.price { display: inline-flex; align-items: center; gap: 5px; }
.locked-row { display: flex; align-items: center; gap: 6px; }

/* Icon-only buttons (the X on every panel, party reorder arrows, +/-) */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; padding: 0; flex: none;
  border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.06); color: #cfe0f2; cursor: pointer;
  transition: .14s; box-shadow: none;
}
.icon-btn:hover { background: rgba(255,255,255,0.14); color: #fff; border-color: var(--gold); transform: none; }
.icon-btn:active { transform: scale(.94); }
.icon-btn .ico { width: 18px; height: 18px; }
.btn.small.icon-btn { width: 32px; height: 32px; }
.close-btn:hover { border-color: var(--danger); color: #ffb3b9; background: rgba(255,90,90,.14); }

/* One header for every panel: title left, close X right. */
.panel-head {
  display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px;
}
.panel-head-text { flex: 1; min-width: 0; }
.panel-head h2, .panel-head h3 {
  margin: 0; color: var(--gold); letter-spacing: .08em; text-transform: uppercase;
  font-size: 1.3rem; line-height: 1.2;
}
.panel-head h3 { font-size: 1.15rem; }
.panel-head .sub { margin: 6px 0 0; color: var(--muted); }
.panel-head.sticky {
  position: sticky; top: 0; z-index: 3; margin: 0;
  padding: 16px 24px 12px; background: linear-gradient(180deg, rgba(12,22,36,.98), rgba(12,22,36,.86));
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.menu-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.menu-col .menu-body { padding-top: 14px; }
.menu-tab { display: flex; align-items: center; gap: 9px; }
.menu-tab .ico { width: 17px; height: 17px; opacity: .85; }
.menu-tab.active .ico { color: var(--gold); opacity: 1; }
.modal .panel-head { margin-bottom: 8px; }
.feed-note { color: #ffe08a; }

/* battle action buttons with icons */
.action-btn .ab-name {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-weight: 800;
}
.action-btn .ico { width: 16px; height: 16px; }
.action-btn small .ico { width: 13px; height: 13px; vertical-align: -.12em; }

@media (max-width: 720px) {
  .battle-log.top { top: 8px; width: 94vw; }
  .combatant-card.enemy { top: 118px; }
  .panel-head.sticky { padding: 12px 14px 10px; }
  .menu-tab span { display: none; }
  .menu-tabs { width: 62px; align-items: center; }
  .menu-tab { justify-content: center; }
}

/* ---------- Battle: buff / debuff readout ---------- */
.buff-row {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;
  min-height: 20px; align-items: center;
}
.buff-row.empty .buff-none {
  font-size: .64rem; letter-spacing: .12em; text-transform: uppercase;
  color: rgba(159,179,201,.5);
}
.buff-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 999px;
  font-size: .66rem; font-weight: 700; letter-spacing: .04em;
  border: 1px solid transparent; white-space: nowrap;
  animation: buffPop .32s cubic-bezier(.2,.9,.3,1.5);
}
@keyframes buffPop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.buff-chip.up {
  background: linear-gradient(180deg, rgba(110,224,140,.24), rgba(28,96,56,.34));
  border-color: rgba(134,240,160,.55); color: #d3ffdf;
  box-shadow: 0 0 10px rgba(110,224,140,.22);
}
.buff-chip.down {
  background: linear-gradient(180deg, rgba(255,140,150,.22), rgba(104,30,40,.34));
  border-color: rgba(255,160,168,.5); color: #ffdfe2;
  box-shadow: 0 0 10px rgba(255,120,130,.18);
}
.buff-chip .bc-arrow { font-size: .6rem; opacity: .95; }
.buff-chip .bc-stat { opacity: .92; }
.buff-chip .bc-val { font-weight: 800; }
.buff-chip .bc-stacks {
  padding: 0 4px; border-radius: 6px; font-size: .58rem; font-weight: 800;
  background: rgba(0,0,0,.34);
}
/* HP drains smoothly so the drop lands with the hit rather than snapping */
.combatant-card .bar > i { transition: width .34s cubic-bezier(.3,.8,.4,1); }

/* =====================================================================
   Modals: never taller than the screen, and the body scrolls.
   ===================================================================== */
.modal-layer { overflow: auto; align-items: flex-start; }
.modal {
  width: min(560px, 94vw); padding: 24px 26px;
  max-height: 94vh; margin: auto;
  display: flex; flex-direction: column;
}
.modal.wide { width: min(980px, 96vw); }
.modal > .panel-head, .modal > .row.end { flex: none; }
.modal-body { min-height: 0; }
.modal-body.scroll-y { overflow: auto; max-height: min(62vh, 620px); padding-right: 6px; }

/* ---------- Labelled bars (HP / EXP / ULT) ---------- */
.bar-wrap { margin: 4px 0 2px; }
.bar-label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.bar-value { color: #cfe0f2; letter-spacing: .04em; font-weight: 700; }
.party-chip .pc-bar { display: flex; align-items: center; gap: 4px; }
.party-chip .pc-tag {
  font-size: .56rem; letter-spacing: .08em; font-weight: 800; color: var(--muted); flex: none;
}
.party-chip .pc-bar .bar { flex: 1; margin-top: 2px; }

/* ---------- Battle: trainer team readout ---------- */
.team-row {
  display: flex; align-items: center; gap: 6px; margin: 4px 0 2px;
  padding: 3px 6px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
}
.team-row.last { border-color: #ffd76a; background: rgba(242, 199, 97, 0.16); }
.team-name {
  font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: #cfe0f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;
}
.team-pips { display: flex; gap: 3px; flex: 1; }
.team-pip { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
.team-pip.alive { background: linear-gradient(90deg, #ffd76a, #ff8a3d); box-shadow: 0 0 6px rgba(255, 170, 60, .6); }
.team-pip.down { background: rgba(255, 255, 255, 0.1); }
.team-count {
  font-size: .6rem; font-weight: 800; letter-spacing: .08em; color: #ffe6a8; white-space: nowrap;
}
.team-row.last .team-count { color: #ffd76a; animation: blink 1s infinite; }

/* ---------- Battle: damage numbers (size reads the weight of the hit) ---------- */
.dmg-float.crit {
  font-size: 2.1rem; color: #ffd76a !important;
  text-shadow: 0 0 14px rgba(255, 200, 90, .9), 0 2px 0 rgba(0, 0, 0, .6);
}
.dmg-float.big {                       /* special attacks */
  font-size: 1.95rem;
  text-shadow: 0 0 10px rgba(0, 0, 0, .75), 0 2px 0 rgba(0, 0, 0, .6);
}
.dmg-float.ult {                       /* ultimate: emphasised, lingers a beat */
  font-size: 2.5rem; letter-spacing: .04em;
  text-shadow: 0 0 18px currentColor, 0 3px 0 rgba(0, 0, 0, .7);
  animation: floatUp 1.45s ease-out forwards;
}
.dmg-float.buff { font-size: 1.35rem; letter-spacing: .06em; }

/* ---------- Level-up summary (can be long: it scrolls) ---------- */
.levelup-body { max-height: min(52vh, 460px); overflow: auto; padding-right: 6px; }
.levelup-body h3 { margin: 0 0 6px; font-size: 1rem; color: var(--gold); letter-spacing: .06em; }
.levelup-body h3:not(:first-child) { margin-top: 14px; }
.levelup-body p { margin: 6px 0 0; }
/* six across, then wrap onto a new row — a vertical column of nine stats was
   far too tall for the evolution and level-up summaries */
.levelup-list {
  display: grid; grid-template-columns: repeat(6, auto);
  justify-content: center; gap: 6px;
}
.levelup-list .gain {
  padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 800; letter-spacing: .04em;
  background: rgba(110, 224, 140, .16); border: 1px solid rgba(134, 240, 160, .45); color: #d3ffdf;
}
.levelup-list .gain.down {
  background: rgba(255, 140, 150, .16); border-color: rgba(255, 160, 168, .45); color: #ffdfe2;
}

   ===================================================================== */
.wiki-screen {
  width: min(1180px, 96vw); height: min(860px, 94vh);

}
.wiki-screen .panel-head.sticky { gap: 14px; }
.wiki-main { flex: 1; display: flex; min-height: 0; }
.wiki-nav {
  width: 224px; flex: none; padding: 14px 12px; display: flex; flex-direction: column; gap: 5px;
  background: rgba(6, 12, 22, 0.55); border-right: 2px solid rgba(242, 199, 97, 0.25); overflow: auto;
}
.wiki-tab {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 9px 12px; border-radius: 10px; border: none; text-align: left; cursor: pointer;
  background: transparent; color: #bfd3e8; font-weight: 700; font-size: .88rem; font-family: inherit;
}
.wiki-tab .ico { width: 16px; height: 16px; opacity: .85; }
.wiki-tab:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.wiki-tab.active {
  background: linear-gradient(90deg, rgba(242, 199, 97, .28), transparent);
  color: var(--gold); box-shadow: inset 3px 0 0 var(--gold);
}
.wiki-nav-foot { margin-top: auto; padding-top: 10px; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.wiki-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.wiki-status { padding: 10px 24px 0; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.wiki-body { flex: 1; overflow: auto; padding: 4px 24px 26px; }
.wiki-h3 { margin: 20px 0 8px; font-size: 1.02rem; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
.wiki-h3:first-child { margin-top: 4px; }
.wiki-p { margin: 0 0 10px; line-height: 1.6; color: #dce9f7; font-size: .92rem; }
.wiki-table { display: flex; flex-direction: column; gap: 3px; margin: 8px 0 14px; }
.wiki-tr {
  display: grid; grid-template-columns: 240px 1fr; gap: 12px;
  padding: 8px 11px; border-radius: 9px; background: rgba(255, 255, 255, 0.05);
  font-size: .87rem; line-height: 1.45;
}
.wiki-tr .wiki-td.k { color: var(--gold); font-weight: 800; }
.wiki-tr .wiki-td.v { color: #dce9f7; }
.wiki-ul { margin: 0 0 14px; padding-left: 20px; line-height: 1.6; font-size: .9rem; color: #dce9f7; }
.wiki-ul li { margin-bottom: 5px; }
.wiki-note {
  margin: 10px 0 14px; padding: 10px 14px; border-left: 3px solid var(--gold);
  background: rgba(242, 199, 97, 0.1); border-radius: 0 10px 10px 0;
  font-size: .88rem; line-height: 1.55; color: #f2e7cd;
}
.wiki-dim { color: var(--muted); font-size: .82rem; }
.wiki-hidden { display: none !important; }
.wiki-card { border: 1.5px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; background: rgba(255, 255, 255, 0.04); }
.wiki-card-head { display: flex; gap: 14px; align-items: flex-start; }
.wiki-portrait { width: 96px; height: 96px; flex: none; }
.wiki-card-title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-weight: 800; font-size: 1.05rem; margin-bottom: 5px; }
.wiki-elgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; margin: 8px 0 14px; }
.wiki-el { padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); font-size: .82rem; }
.wiki-el.strong { background: rgba(110, 224, 140, 0.16); color: #c9ffd8; }
.wiki-el.weak { background: rgba(255, 140, 150, 0.14); color: #ffd8dc; }
.wiki-body code {
  background: rgba(0, 0, 0, 0.4); padding: 2px 7px; border-radius: 6px;
  font-size: .84em; color: #ffe9b8; word-break: break-word;
}
.wiki-body .good { color: var(--ok); }
.wiki-body .bad { color: var(--danger); }
input[type="text"].wiki-search {
  width: 240px; padding: 9px 13px; font-size: .88rem; letter-spacing: normal; text-transform: none;
  background: rgba(8, 16, 26, 0.9); border: 1.5px solid rgba(242, 199, 97, 0.4); border-radius: 10px;
}

@media (max-width: 900px) {
  .wiki-nav { width: 58px; align-items: center; }
  .wiki-tab span { display: none; }
  .wiki-tab { justify-content: center; }
  .wiki-nav-foot { display: none; }
  .wiki-tr { grid-template-columns: 1fr; gap: 2px; }
  .wiki-body, .wiki-status { padding-left: 14px; padding-right: 14px; }
  input[type="text"].wiki-search { width: 150px; }
  .wiki-card-head { flex-direction: column; }
  .wiki-portrait { width: 78px; height: 78px; }
}

        await new Promise((resolve) => this.runEvolution(m, resolve));
      }
    }
    runEvolution(m, done) {
      const result = EvolutionManager.perform(m);
      if (!result) {
        done && done();
        return;
      }
      evolutionCinematic(m, result, async () => {
        AudioManager.playTheme(this.mode === "overworld" ? getMap(this.overworld.mapId).music : "battle");
        await this.autosave();
        this.updateHud();
        done && done();
      });
    }
    async handleWhiteout() {
      var _a;
      const penalty = Math.floor(GameState.player.wildcoins * DEFEAT_COIN_PENALTY);
      PlayerManager.addCoins(-penalty);
      await modal({
        title: "YOU WERE DEFEATED",
        body: `All of your Mythlings fainted. You hurried back to the nearest Mythling Center and paid <b>${coins(penalty)} Wildcoins</b> in care fees.<br><br>Your Mythlings, items and progress are all safe.`,
        buttons: [{ label: "CONTINUE", value: true, primary: true }]
      });
      PartyManager.healAll();
      const here = this.overworld.mapId;
      const hasCentre = (_a = getMap(here)) == null ? void 0 : _a.buildings.some((b) => b.type === "center");
      const healMap = hasCentre ? here : GameState.player.lastHealMap || "verdant_vale";
      const map = getMap(healMap);
      const center = map.buildings.find((b) => b.type === "center");
      const point = center ? { x: center.x + center.w / 2, y: center.y + center.h + 60 } : map.spawn;
      await this.enterWorld(healMap, point);
      toast("Your team was fully healed.", "ok");
      await this.autosave();
    }
    // ------------------------------------------------------------ cheat menu
    /** Press DEL any time during play. Adds Wildcoins instantly. */
    openCheatMenu() {
      if (this.mode === "menu") return;
      const layer = document.getElementById("modal");
      if (layer && !layer.classList.contains("hidden")) return;
      AudioManager.sfx("confirm");
      const bal = el("b", { style: { color: "#ffe08a", fontSize: "1.15rem" }, text: GameState.player.wildcoins.toLocaleString() });
      const add = (n) => {
        PlayerManager.addCoins(n);
        AudioManager.sfx("coin");
        bal.textContent = GameState.player.wildcoins.toLocaleString();
        this.updateHud();
        toast(`+${n.toLocaleString()} Wildcoins`, "ok");
      };
      const coinBtn = (n) => button(`+${n.toLocaleString()}`, {
        class: "small primary",
        sfx: "coin",
        title: `Add ${n.toLocaleString()} Wildcoins`,
        onclick: () => add(n)
      });
      const body = el("div", {}, [
        el("p", { class: "sub", text: "Cheat menu \u2014 press DEL again any time to reopen it. Wildcoins are added instantly." }),
        el("div", { class: "coin-pill", style: { display: "inline-flex", marginBottom: "14px" } }, [
          icon("coin", "gold"),
          el("span", { text: "Wildcoins:" }),
          bal
        ]),
        el("div", { class: "row", style: { gap: "8px" } }, [100, 1e3, 1e5, 1e6].map(coinBtn)),
        el("div", { style: { height: "12px" } }),
        el("p", { class: "sub", style: { margin: 0 }, text: "Spend them in any region shop: balls, potions, revive herbs and EXP food." })
      ]);
      modal({ title: "CHEAT MENU", body, buttons: [{ label: "CLOSE", value: true, primary: true }] }).then(() => this.autosave());
    }
    // ------------------------------------------------------------ saving
    async saveGame(slot, manual = false, message = "Game saved successfully.") {
      if (this.savingLock) return;
      this.savingLock = true;
      try {
        const data = serialize();
        await SaveManager.save(slot, data);
        this.lastSaveInfo = Date.now();
        AudioManager.sfx("save");
        toast(manual ? message : "Game Saved", "ok");
      } catch (e) {
        console.error(e);
        toast("Save failed!", "bad");
      } finally {
        this.savingLock = false;
      }
    }
    /** Autosave after meaningful events; debounced so it never duplicates rewards. */
    async autosave(label) {
      if (this.autosaveLock) return;
      this.autosaveLock = true;
      toast("Saving\u2026");
      try {
        await SaveManager.save(GameState.slot, serialize());
        this.lastSaveInfo = Date.now();
        setTimeout(() => toast(label || "Game Saved", "ok"), 260);
      } catch (e) {
        console.error(e);
      } finally {
        setTimeout(() => {
          this.autosaveLock = false;
        }, 1200);
      }
    }
    // ------------------------------------------------------------ HUD
    updateHud() {
      if (this.mode !== "overworld") return;
      const strip2 = document.getElementById("hud-party");
      strip2.innerHTML = "";
      for (const m of PartyManager.list()) {
        const pct = hpPercent(m);
        const chip = el("div", { class: `party-chip ${isFainted(m) ? "fainted" : ""}` }, [
          mythCanvas(m, 76),
          el("div", { class: "pc-name", text: displayName(m) }),
          el("div", { class: "pc-lv", text: `Lv.${m.level}${m.level >= LEVEL_CAP ? " MAX" : ""}` }),
          // Labelled bars: green is HP, orange is Ultimate Charge. Neither is EXP —
          // EXP is only shown (and only ever grows) on the party cards in the menu.
          el("div", { class: "pc-bar", title: `HP ${m.currentHp}/${maxHp(m)}` }, [
            el("span", { class: "pc-tag", text: "HP" }),
            bar("hp", pct, hpClass(pct))
          ]),
          el("div", { class: "pc-bar", title: `Ultimate Charge ${m.ultCharge}/8 \u2014 reset to 0 by a Center heal, never affects EXP` }, [
            el("span", { class: "pc-tag", text: "ULT" }),
            bar("ult", m.ultCharge / 8)
          ])
        ]);
        chip.addEventListener("click", () => this.openMenu("party"));
        strip2.appendChild(chip);
      }
      document.getElementById("hud-coins").textContent = coins(GameState.player.wildcoins);
      document.getElementById("hud-location").textContent = this.overworld.currentRegionName();
      const obj = document.getElementById("objective");
      const objective = this.currentObjective();
      obj.innerHTML = objective ? `${iconSvg(objective.done ? "check" : "objective", objective.done ? "good" : "gold")} <span>${objective.text}</span>` : "";
      obj.classList.toggle("show", !!objective);
      this.drawMinimap();
    }
    currentObjective() {
      const goal = (text) => ({ text, done: false });
      if (WorldManager.getFlag("version_complete")) return { text: "Current version complete \u2014 free exploration!", done: true };
      const mapId = this.overworld.mapId;
      if (mapId === "verdant_vale") {
        if (!WorldManager.isTrainerDefeated("vale_guardian")) return goal("Defeat the Verdant Guardian at the Verdant Gate");
        return goal("Travel east to Azure Coast");
      }
      if (mapId === "azure_coast") {
        if (!WorldManager.isTrainerDefeated("coast_guardian")) return goal("Defeat the Cavern Guardian in Azure Caverns");
        return goal("Travel east to Emberwild");
      }
      if (mapId === "emberwild") {
        if (!WorldManager.isTrainerDefeated("flame_warden")) return goal("Challenge the Flame Warden in the Volcanic Ruins");
      }
      return null;
    }
    drawMinimap() {
      const cv = document.getElementById("minimap");
      const ctx = cv.getContext("2d");
      const d = this.overworld.minimapData();
      const sx = cv.width / d.w, sy = cv.height / d.h;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "rgba(12,22,34,0.85)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "rgba(80,180,110,0.25)";
      for (const z of d.zones) ctx.fillRect(z[0] * sx, z[1] * sy, z[2] * sx, z[3] * sy);
      ctx.fillStyle = "rgba(240,200,120,0.85)";
      for (const b of d.buildings) ctx.fillRect(b[0] * sx, b[1] * sy, Math.max(3, b[2] * sx), Math.max(3, b[3] * sy));
      ctx.fillStyle = "rgba(160,220,255,0.9)";
      for (const c of d.conns) ctx.fillRect(c[0] * sx, c[1] * sy, Math.max(3, c[2] * sx), Math.max(3, c[3] * sy));
      for (const w of d.wild) {
        ctx.fillStyle = ELEMENTS[w[2]].color;
        ctx.beginPath();
        ctx.arc(w[0] * sx, w[1] * sy, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(d.px * sx, d.py * sy, 3.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
    }
  };
  window.addEventListener("DOMContentLoaded", () => {
    window.__game = new Game();
    console.log(`%cMYTHLINGS: WILDBOUND v${GAME_VERSION}`, "color:#f2c761;font-weight:bold;font-size:14px");
  });
})();
