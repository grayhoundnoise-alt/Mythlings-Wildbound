<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mythlings: Wildbound</title>
<link rel="stylesheet" href="./src/ui/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234fc76a' d='M20.4 3.2c-7.6-.6-12.2 1.5-14.4 4.6-2.2 3.2-1.5 7 .3 9l1.9-2.9c.4-2.6 1.7-4.9 4-6.6-1.6 2-2.6 4.3-3 6.9l-2.9 4.4a1.1 1.1 0 0 0 1.8 1.2l1.7-2.6c2.6 1 6.1.5 8.4-2.3 2.6-3.1 3.1-7.6 2.2-11.7Z'/></svg>" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- ===================== HUD (exploration) ===================== -->
    <div id="hud" class="hud hidden">
      <div class="hud-topleft">
        <div id="hud-party" class="party-strip"></div>
      </div>
      <div class="hud-topright">
        <div class="coin-pill"><svg class="ico gold" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4c5.3 0 9.6 2.2 9.6 4.8v9.6c0 2.6-4.3 4.8-9.6 4.8s-9.6-2.2-9.6-4.8V7.2c0-2.6 4.3-4.8 9.6-4.8Zm0 2.2C7.9 4.6 4.6 6 4.6 7.2S7.9 9.8 12 9.8s7.4-1.4 7.4-2.6S16.1 4.6 12 4.6Zm-1.1 3.2h2.2v1c1 .2 1.7.8 1.7 1.7h-1.8c0-.3-.4-.5-1-.5s-1 .2-1 .5.3.4 1.2.6c1.6.3 2.7.8 2.7 2.1 0 1-.8 1.7-1.8 1.9v1h-2.2v-1c-1.1-.2-1.9-.9-1.9-1.9h1.8c0 .4.5.6 1.2.6s1.1-.2 1.1-.5-.4-.5-1.4-.7c-1.4-.3-2.5-.8-2.5-2 0-.9.7-1.6 1.7-1.8Z"/></svg><span id="hud-coins">0</span></div>
        <div id="hud-location" class="location-pill">Verdant Vale</div>
        <canvas id="minimap" width="190" height="110" class="minimap"></canvas>
      </div>
      <div class="hud-bottomleft">
        <div class="hint-pill"><b>WASD</b> move · <b>E</b> interact · <b>ESC</b> menu / close</div>
        <div id="objective" class="objective-pill"></div>
      </div>
      <div class="hud-bottomright">
        <button class="round-btn" id="btn-menu" title="Menu (ESC)" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 5.4h17.2v2.3H3.4Zm0 5.5h17.2v2.2H3.4Zm0 5.4h17.2v2.3H3.4Z"/></svg></button>
        <button class="round-btn" id="btn-interact" title="Interact (E)">E</button>
      </div>
      <div id="touch-joystick" class="joystick hidden"><div class="joystick-knob"></div></div>
    </div>

    <!-- ===================== Screen stack ===================== -->
    <div id="screens"></div>

    <!-- ===================== Dialogue ===================== -->
    <div id="dialogue" class="dialogue hidden">
      <div class="dialogue-box panel">
        <div class="dialogue-name" id="dialogue-name"></div>
        <div class="dialogue-text" id="dialogue-text"></div>
        <div class="dialogue-next"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.8 4.8 8.6l1.6-1.6L12 12.6l5.6-5.6 1.6 1.6Z"/></svg> [Space]</div>
      </div>
    </div>

    <!-- ===================== Toast / autosave ===================== -->
    <div id="toast-layer" class="toast-layer"></div>

    <!-- ===================== Modal ===================== -->
    <div id="modal" class="modal-layer hidden"></div>

    <div id="fade" class="fade"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
