<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYTHLING EDIT — Mythlings: Wildbound Creature, Map & Animation Editor</title>
<meta name="description" content="Standalone offline editor for Mythlings: Wildbound — creatures, rigs, anchors, animations, VFX, maps, collision, spawns, warps and NPCs. Exports JSON / JavaScript / Arena AI packages.">
<style>
/* MYTHLING EDIT — dark fantasy developer tool theme */
:root {
  --bg: #0b1220; --bg2: #101a2c; --bg3: #15223a; --panel: #0f1828; --panel2: #132036;
  --line: #22314d; --line2: #2d4066; --text: #dbe6f5; --muted: #8194b3; --dim: #5a6b8a;
  --accent: #3b82f6; --accent2: #60a5fa; --gold: #f2c761; --green: #4ade80; --red: #f87171;
  --orange: #fb923c; --purple: #c084fc; --cyan: #22d3ee; --blue: #38bdf8;
  --left-w: 300px; --right-w: 340px; --bottom-h: 240px;
  --radius: 8px; --font: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #27385a; border-radius: 6px; border: 2px solid var(--panel); }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.gold { color: var(--gold); }
.row { display: flex; align-items: center; gap: 6px; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
kbd { font: 11px var(--mono); background: #1b2942; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #c7d5ea; }

/* ---------- app grid ---------- */
#app {
  height: 100%; display: grid;
  grid-template-rows: 34px 54px minmax(0, 1fr) auto 26px;
  grid-template-columns: var(--left-w) 5px minmax(360px, 1fr) 5px var(--right-w);
  grid-template-areas:
    "menu menu menu menu menu"
    "tools tools tools tools tools"
    "left lsplit center rsplit right"
    "bottom bottom bottom bottom bottom"
    "status status status status status";
}
#app.left-collapsed { --left-w: 0px !important; }
#app.right-collapsed { --right-w: 0px !important; }
#app.bottom-collapsed #bottom-panel { display: none; }
#app.playtest #left-panel, #app.playtest #right-panel, #app.playtest #bottom-panel, #app.playtest #toolbar,
#app.playtest #lsplit, #app.playtest #rsplit { display: none; }
#app.playtest { grid-template-columns: 0 0 1fr 0 0; grid-template-rows: 34px 0 1fr 0 26px; }

/* ---------- menu bar ---------- */
#menubar { grid-area: menu; display: flex; align-items: stretch; background: #0a1120; border-bottom: 1px solid var(--line); user-select: none; z-index: 40; }
.logo { display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; font-weight: 900; letter-spacing: .08em; color: var(--accent2); font-size: 14px; }
.logo svg { width: 20px; height: 20px; }
.logo b { color: #fff; }
.menu-root { display: flex; align-items: stretch; }
.menu-btn { background: none; border: 0; color: var(--text); padding: 0 11px; font-weight: 600; font-size: 12.5px; letter-spacing: .02em; }
.menu-btn:hover, .menu-btn.open { background: var(--bg3); color: #fff; }
.menu-right { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-right: 12px; color: var(--muted); font-size: 12px; }
.menu-right .pill { background: var(--bg3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--text); }
.menu-wrap { position: relative; display: flex; align-items: stretch; }
.dropdown {
  position: absolute; top: 100%; left: 0; z-index: 1000; min-width: 230px; background: #0e182b; border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 14px 40px rgba(0,0,0,.55); padding: 5px; display: flex; flex-direction: column;
}
.dropdown .mi { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 5px; border: 0; background: none; color: var(--text); text-align: left; width: 100%; }
.dropdown .mi:hover { background: var(--accent); color: #fff; }
.dropdown .mi:hover kbd { color: #fff; border-color: rgba(255,255,255,.5); background: transparent; }
.dropdown .mi.disabled { opacity: .4; pointer-events: none; }
.dropdown .mi .check { width: 14px; color: var(--green); }
.dropdown .mi kbd { margin-left: auto; }
.dropdown .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.dropdown .mi.danger:hover { background: var(--red); }

/* ---------- toolbar ---------- */
#toolbar { grid-area: tools; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--bg2); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
.tool-group { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); height: 44px; }
.tool-group:last-child { border-right: 0; }
.tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 58px; height: 44px; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tool svg { width: 18px; height: 18px; }
.tool:hover { background: var(--bg3); color: var(--text); }
.tool.active { background: rgba(59,130,246,.18); border-color: var(--accent); color: #fff; box-shadow: inset 0 0 0 1px rgba(96,165,250,.35); }
.tool:disabled { opacity: .35; pointer-events: none; }
.tool.primary { color: var(--green); }
.tool.warn { color: var(--gold); }
.tool .badge { position: absolute; top: 3px; right: 5px; font-size: 8px; color: var(--dim); }

/* ---------- panels ---------- */
.panel { background: var(--panel); border-color: var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
#left-panel { grid-area: left; border-right: 1px solid var(--line); }
#right-panel { grid-area: right; border-left: 1px solid var(--line); }
#bottom-panel { grid-area: bottom; height: var(--bottom-h); border-top: 1px solid var(--line); }
#app.left-collapsed #left-panel, #app.right-collapsed #right-panel { display: none; }
.splitter { background: transparent; cursor: col-resize; position: relative; z-index: 5; }
.splitter:hover, .splitter.dragging { background: var(--accent); }
#lsplit { grid-area: lsplit; }
#rsplit { grid-area: rsplit; }
#bsplit { height: 5px; cursor: row-resize; flex: none; }
#bsplit:hover { background: var(--accent); }
.tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
.tab { flex: 1; border: 0; background: none; color: var(--muted); padding: 7px 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: #fff; border-bottom-color: var(--accent); background: rgba(59,130,246,.08); }
.panel-body { flex: 1; overflow: auto; padding: 8px; min-height: 0; }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg2); border-bottom: 1px solid var(--line); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex: none; }
.section { margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel2); }
.section > h4 { margin: 0; padding: 6px 10px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
.section > h4 .spacer { flex: 1; }
.section > .sec-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.field { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 6px; min-height: 26px; }
.field > label { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.field .triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; background: #0b1424; border: 1px solid var(--line2); border-radius: 5px; padding: 4px 7px; color: var(--text); outline: none; min-width: 0;
}
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
input[type=number] { font-family: var(--mono); font-size: 12px; }
input[type=color] { width: 100%; height: 26px; padding: 0 2px; background: #0b1424; border: 1px solid var(--line2); border-radius: 5px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
textarea { font-family: var(--mono); font-size: 11.5px; resize: vertical; }
.num-wrap { position: relative; display: flex; align-items: center; }
.num-wrap span.unit { position: absolute; right: 7px; color: var(--dim); font-size: 10px; pointer-events: none; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12px; min-height: 24px; }
.toggle input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 999px; background: #223250; border: 1px solid var(--line2); position: relative; margin: 0; cursor: pointer; flex: none; transition: .15s; }
.toggle input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #8fa3c5; transition: .15s; }
.toggle input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent2); }
.toggle input[type=checkbox]:checked::after { left: 16px; background: #fff; }
.toggle input[type=checkbox]:disabled { opacity: .4; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #1a2740; border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; color: var(--text); font-weight: 600; font-size: 12px; white-space: nowrap; }
.btn:hover { background: #22345a; border-color: #3b5384; }
.btn.primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
.btn.primary:hover { background: #2f74e8; }
.btn.good { background: #14532d; border-color: #16a34a; color: #dcfce7; }
.btn.danger { background: #4c1d1d; border-color: #b91c1c; color: #fee2e2; }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 8px; font-size: 11px; }
.btn.tiny { padding: 1px 6px; font-size: 10.5px; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn svg { width: 14px; height: 14px; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 8px; font-size: 10.5px; background: #0b1424; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0; line-height: 1; }
.chip button:hover { color: var(--red); }
.hint { font-size: 11px; color: var(--muted); line-height: 1.45; }
.empty { padding: 18px 10px; text-align: center; color: var(--dim); font-size: 12px; }

/* ---------- lists / hierarchy ---------- */
.tree { user-select: none; }
.tree-item { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 0; border-radius: 4px; cursor: pointer; white-space: nowrap; min-height: 24px; }
.tree-item:hover { background: rgba(255,255,255,.04); }
.tree-item.selected { background: rgba(59,130,246,.22); color: #fff; }
.tree-item.drop-target { outline: 1px dashed var(--accent2); }
.tree-item.hidden-node { opacity: .5; }
.tree-item .caret { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); font-size: 9px; flex: none; }
.tree-item .caret.leaf { visibility: hidden; }
.tree-item .ticon { width: 16px; height: 16px; flex: none; color: var(--muted); }
.tree-item .ticon svg { width: 14px; height: 14px; }
.tree-item .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-item .tname input { padding: 0 4px; height: 20px; }
.tree-item .tflags { display: none; gap: 2px; }
.tree-item:hover .tflags, .tree-item.selected .tflags, .tree-item.flagged .tflags { display: inline-flex; }
.tflag { width: 18px; height: 18px; border: 0; background: none; color: var(--dim); padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; }
.tflag svg { width: 12px; height: 12px; }
.tflag.on { color: var(--text); }
.tflag:hover { background: rgba(255,255,255,.1); color: #fff; }
.list-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.list-item:hover { background: rgba(255,255,255,.04); }
.list-item.selected { background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.4); }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .li-sub { font-size: 10.5px; color: var(--muted); }
.thumb { width: 42px; height: 42px; border-radius: 6px; background: #0b1424; border: 1px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb canvas, .thumb img { max-width: 100%; max-height: 100%; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: grab; text-align: center; font-size: 10.5px; }
.card:hover { border-color: var(--accent); }
.card.selected { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2); }
.card canvas { width: 56px; height: 56px; }
.card .cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.cat-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.cat-btn { text-align: left; border: 0; background: none; color: var(--muted); padding: 5px 8px; border-radius: 5px; display: flex; gap: 8px; align-items: center; }
.cat-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
.cat-btn.active { background: rgba(59,130,246,.18); color: #fff; }
.cat-btn .cnt { margin-left: auto; color: var(--dim); font-size: 10px; }
.search { position: relative; margin-bottom: 8px; }
.search input { padding-left: 26px; }
.search svg { position: absolute; left: 8px; top: 7px; width: 13px; height: 13px; color: var(--dim); }

/* ---------- center workspace ---------- */
#center { grid-area: center; position: relative; background: #0a101c; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
#center-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: rgba(13,21,37,.92); border-bottom: 1px solid var(--line); flex: none; z-index: 3; }
.mode-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(59,130,246,.15); border: 1px solid rgba(96,165,250,.5); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.mode-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.crumb { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.crumb select { width: auto; padding: 2px 6px; }
.crumb b { color: var(--text); }
#center-head .view-tools { margin-left: auto; display: flex; gap: 4px; align-items: center; }
#center-head .coord { font-family: var(--mono); font-size: 11px; color: var(--muted); background: #0b1424; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; min-width: 150px; text-align: center; }
#canvas-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; outline: none; }
#scene.tool-select { cursor: default; }
#scene.tool-move { cursor: move; }
#scene.panning { cursor: grabbing; }
#scene.tool-paint, #scene.tool-erase, #scene.tool-fill { cursor: cell; }
.canvas-overlay { position: absolute; pointer-events: none; }
.float-left { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.float-tools { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
.ftool { width: 34px; height: 34px; background: rgba(13,21,37,.92); border: 1px solid var(--line2); border-radius: 7px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.ftool svg { width: 16px; height: 16px; }
.ftool:hover { color: #fff; border-color: var(--accent2); }
.ftool.active { color: #fff; background: rgba(59,130,246,.35); border-color: var(--accent2); }
.sub-toolbar { position: absolute; top: 10px; left: 54px; right: 10px; display: flex; gap: 6px; align-items: center; z-index: 3; pointer-events: none; }
.sub-toolbar > * { pointer-events: auto; }
.sub-toolbar .box { display: flex; gap: 4px; align-items: center; background: rgba(13,21,37,.92); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 6px; }
.sub-toolbar .box label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; margin-right: 2px; }
.sub-toolbar .box .btn.small.active { background: var(--accent); color: #fff; border-color: var(--accent2); }
.anim-strip { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(13,21,37,.92); border: 1px solid var(--line2); border-radius: 10px; padding: 6px 8px; z-index: 3; max-width: calc(100% - 40px); overflow-x: auto; }
.anim-strip .acard { border: 1px solid var(--line); background: #0b1424; border-radius: 7px; padding: 4px 8px; color: var(--muted); font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.anim-strip .acard.active { border-color: var(--accent2); color: #fff; background: rgba(59,130,246,.25); }
.anim-strip .acard:hover { color: #fff; }
.mini-legend { position: absolute; right: 10px; bottom: 10px; background: rgba(13,21,37,.92); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; font-size: 10.5px; display: flex; flex-direction: column; gap: 3px; z-index: 3; }
.mini-legend span { display: flex; align-items: center; gap: 6px; }
.mini-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
#playtest-hud { position: absolute; left: 12px; top: 12px; z-index: 6; display: flex; gap: 8px; align-items: center; }
#playtest-hud .pt-badge { background: rgba(220,38,38,.85); color: #fff; font-weight: 900; letter-spacing: .12em; padding: 6px 12px; border-radius: 6px; font-size: 11px; }
#playtest-msg { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); z-index: 6; background: rgba(8,14,26,.92); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 18px; max-width: 70%; font-size: 14px; }
#playtest-msg b { color: var(--gold); display: block; margin-bottom: 4px; }
#playtest-msg small { display: block; color: var(--muted); margin-top: 6px; }
.context-menu { position: fixed; z-index: 1200; background: #0e182b; border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.55); padding: 5px; min-width: 190px; }
.context-menu .mi { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 5px; border: 0; background: none; color: var(--text); text-align: left; width: 100%; font-size: 12px; }
.context-menu .mi:hover { background: var(--accent); color: #fff; }
.context-menu .mi.disabled { opacity: .4; pointer-events: none; }
.context-menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }

/* ---------- bottom / timeline ---------- */
#bottom-panel .tabs .tab { flex: none; padding: 7px 14px; }
#bottom-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tl-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--bg2); flex: none; flex-wrap: wrap; }
.tl-head .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.tl-head input[type=number] { width: 64px; }
.tl-head select { width: auto; }
.tl-head .time { font-family: var(--mono); color: var(--gold); min-width: 60px; }
.tl-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 150px 1fr; overflow: hidden; }
.tl-tracks { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
.tl-track { height: 22px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 11.5px; white-space: nowrap; }
.tl-track.header { height: 26px; background: var(--bg2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.tl-track.selected { background: rgba(59,130,246,.15); }
.tl-track .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tl-track .k { color: var(--dim); font-size: 10px; }
#tl-canvas-wrap { position: relative; overflow: auto; }
#timeline { display: block; cursor: default; }
.tl-icon { width: 26px; height: 26px; border: 1px solid var(--line2); background: #1a2740; border-radius: 5px; color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
.tl-icon svg { width: 13px; height: 13px; }
.tl-icon:hover { border-color: var(--accent2); }
.tl-icon.active { background: var(--accent); border-color: var(--accent2); }
.console { font-family: var(--mono); font-size: 11.5px; padding: 8px 10px; overflow: auto; flex: 1; }

.guide h4:first-child { margin-top: 0; }
.guide ol, .guide ul { margin: 4px 0 4px 18px; padding: 0; }
pre.ref { font: 11.5px/1.5 var(--mono); background: #070c16; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 70vh; margin: 0; white-space: pre-wrap; }

/* start screen (built by App.showStart) */
.start-card { display: block; }
.start-logo { margin-bottom: 22px; }
.start-logo .title { font-size: 32px; font-weight: 900; letter-spacing: .14em; color: #fff; }
.start-logo .title .accent { color: var(--accent2); }
.start-logo .sub { color: var(--muted); margin-top: 4px; font-size: 13px; }
.start-logo .ver { color: var(--dim); font-size: 11px; margin-top: 2px; }
.start-cols { display: grid; grid-template-columns: 1.05fr 1fr; gap: 26px; }
.start-actions { display: flex; flex-direction: column; gap: 8px; }
.start-actions .hint { margin-top: 6px; }
.start-recent { border: 1px solid var(--line); border-radius: 10px; background: #0b1424; overflow: hidden; display: flex; flex-direction: column; min-height: 260px; max-height: 420px; }
.start-recent .panel-head { border-radius: 0; }
.recent-list { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.recent-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); cursor: pointer; }
.recent-row:hover { border-color: var(--accent2); }
.recent-row .name { font-weight: 700; }
.recent-row .meta { color: var(--muted); font-size: 11px; }

/* playtest */
#playtest-hud { flex-wrap: wrap; max-width: calc(100% - 24px); }
#playtest-hud .hud-info { font-family: var(--mono); font-size: 11px; color: var(--text); background: rgba(13,21,37,.85); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 10px; }
#playtest-hud .map-select { background: rgba(13,21,37,.9); }
#playtest-hud .pt-strip { width: 100%; display: flex; gap: 4px; flex-wrap: wrap; }
#playtest-hud .pt-strip .btn.tiny { background: rgba(13,21,37,.9); }
#playtest-msg { padding: 0; background: transparent; border: 0; }
.pt-dialog { background: rgba(8,14,26,.94); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 18px; min-width: 320px; max-width: 640px; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
.pt-dialog .title { color: var(--gold); font-weight: 900; letter-spacing: .1em; font-size: 11px; margin-bottom: 4px; }
.pt-dialog .text { font-size: 14px; line-height: 1.45; }
.pt-dialog .hint { margin-top: 6px; }
.pt-dialog.encounter { border-color: var(--red); box-shadow: 0 0 40px rgba(248,113,113,.25); }
#app.playtest #center-head { display: none; }

  return new Promise((resolve) => {
    const ov = h('div', { class: 'overlay' });

    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    box.appendChild(h('header', {}, [h('h3', { text: title || '' }), h('button', { class: 'x', title: 'Close', onclick: () => close(null) }, '×')]));

    box.appendChild(b);

// =============================================================================
// Persistent storage — IndexedDB with a localStorage fallback.
// Stores: projects (id → { meta, data }), kv (recent list, last project, layout)
// =============================================================================
const Store = {
  db: null, ready: null, fallback: false,
  init() {
    if (this.ready) return this.ready;
    this.ready = new Promise((resolve) => {
      if (!('indexedDB' in window)) { this.fallback = true; resolve(); return; }
      let req;
      try { req = indexedDB.open('MythlingEditDB', 1); } catch { this.fallback = true; resolve(); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => { this.fallback = true; ConsoleLog.warn('IndexedDB unavailable — using localStorage'); resolve(); };
    });
    return this.ready;
  },
  _tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode);
      const os = tx.objectStore(store);
      const req = fn(os);
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },
  // ---- kv
  async getKV(key, def = null) {
    await this.init();
    if (this.fallback) { try { const v = localStorage.getItem('me_kv_' + key); return v == null ? def : JSON.parse(v); } catch { return def; } }
    const v = await this._tx('kv', 'readonly', (os) => os.get(key));
    return v === undefined ? def : v;
  },
  async setKV(key, value) {
    await this.init();
    if (this.fallback) { try { localStorage.setItem('me_kv_' + key, JSON.stringify(value)); } catch (e) { ConsoleLog.error('localStorage full: ' + e.message); } return; }
    await this._tx('kv', 'readwrite', (os) => os.put(value, key));
  },
  // ---- projects
  async listProjects() {
    await this.init();
    if (this.fallback) {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('me_project_')) { try { const p = JSON.parse(localStorage.getItem(k)); out.push(p.meta); } catch { /* skip */ } }
      }
      return out;
    }
    const all = await this._tx('projects', 'readonly', (os) => os.getAll());
    return (all || []).map((p) => p.meta);
  },
  async loadProject(id) {
    await this.init();
    if (this.fallback) { try { const p = JSON.parse(localStorage.getItem('me_project_' + id)); return p ? p.data : null; } catch { return null; } }
    const p = await this._tx('projects', 'readonly', (os) => os.get(id));
    return p ? p.data : null;
  },
  async saveProject(project) {
    await this.init();
    const meta = {
      id: project.project.id, name: project.project.name, version: project.project.version,
      lastSaved: project.project.lastSaved, changeCount: project.project.changeCount,
      maps: Object.keys(project.maps).length, mythlings: Object.keys(project.mythlings).length,
    };
    if (this.fallback) {
      try { localStorage.setItem('me_project_' + meta.id, JSON.stringify({ id: meta.id, meta, data: project })); }
      catch (e) { throw new Error('Browser storage is full (' + e.message + '). Export the project as a file to keep it safe.'); }
    } else {
      await this._tx('projects', 'readwrite', (os) => os.put({ id: meta.id, meta, data: project }));
    }
    const recent = (await this.getKV('recent', [])).filter((r) => r.id !== meta.id);
    recent.unshift(meta);
    await this.setKV('recent', recent.slice(0, 12));
    await this.setKV('lastProject', meta.id);
  },
  async deleteProject(id) {
    await this.init();
    if (this.fallback) localStorage.removeItem('me_project_' + id);
    else await this._tx('projects', 'readwrite', (os) => os.delete(id));
    const recent = (await this.getKV('recent', [])).filter((r) => r.id !== id);
    await this.setKV('recent', recent);
  },
};

// NPC sprite (procedural little person) — shared by the prefab renderer, playtest and browser
function drawNpcSprite(ctx, n, t = 0, facing = 'down') {
  const c = n.npc?.color || '#7ad06a';
  const kind = n.npc?.kind || 'regular';
  pfShadow(ctx, 14, 0, 0.9);
  const bob = Math.sin(t * 2 + (n.x || 0)) * 1.2;
  pfRect(ctx, -10, -30 + bob, 20, 26, c, shade(c, 0.45), 6);            // body
  pfEllipse(ctx, 0, -38 + bob, 11, 11, '#f5d5b0', '#8a6a44');            // head
  const hair = { regular: '#5c3f26', trainer: '#c94a2a', shop: '#f2c761', healer: '#ffffff', savepoint: '#7fd6ff', quest: '#c084fc', guide: '#3f8f4f' }[kind] || '#5c3f26';
  pfEllipse(ctx, 0, -44 + bob, 11, 6, hair);
  ctx.fillStyle = '#2a2a33';
  if (facing !== 'up') { ctx.fillRect(-4, -39 + bob, 2, 3); ctx.fillRect(2, -39 + bob, 2, 3); }
  pfRect(ctx, -9, -6 + bob, 7, 6, '#3f2a18'); pfRect(ctx, 2, -6 + bob, 7, 6, '#3f2a18');
  if (kind === 'trainer') { pfRect(ctx, -12, -46 + bob, 24, 5, '#c94a2a', '#5a1405', 2); }
  if (kind === 'shop') { pfRect(ctx, -14, -24 + bob, 8, 10, '#8a5a2e', '#3f2a18', 2); }
  if (kind === 'healer') { ctx.fillStyle = '#ef4444'; ctx.fillRect(-1.5, -24 + bob, 3, 9); ctx.fillRect(-4.5, -21 + bob, 9, 3); }
  if (kind === 'quest') { ctx.fillStyle = '#f2c761'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', 0, -54 + bob); }
}

/** Build a lightweight 8–12 part rig with anchors and pivots for a body type. */
function buildRig(bodyType, pal) {
  const T = BODY_TEMPLATES[bodyType] || BODY_TEMPLATES.fox;
  const nodes = {}, root = [], parts = {};
  const add = (role, type, props, parentId) => {
    const n = makeNode(type, Object.assign({ name: role, stroke: pal.dark, strokeWidth: 2 }, props));
    n.partType = props.partType || role.replace(/_.*/, '');
    nodes[n.id] = n;
    if (parentId) { n.parent = parentId; nodes[parentId].children.push(n.id); } else root.push(n.id);
    parts[role] = n.id;
    return n;
  };
  const [bw, bh, by] = T.body;
  const [hw, hh, hx, hy] = T.head;
  const rootN = add('ROOT', 'group', { x: 0, y: 0, partType: 'Group' });
  const body = add('BODY', 'ellipse', { x: 0, y: by, shape: { w: bw, h: bh }, fill: pal.primary, z: 2, partType: 'Body' }, rootN.id);
  // tail (behind the body)
  const tail = add('TAIL', 'ellipse', { x: T.tail.x, y: T.tail.y, shape: { w: T.tail.len, h: T.tail.w }, pivotX: T.tail.len / 2, pivotY: 0, rotation: bodyType === 'feline' ? 30 : 12, fill: bodyType === 'avian' ? pal.secondary : pal.primary, z: -2, partType: 'Tail' }, body.id);
  if (bodyType !== 'avian') add('TAIL_TIP', 'ellipse', { x: -T.tail.len * 0.36, y: 0, shape: { w: T.tail.len * 0.34, h: T.tail.w * 0.9 }, fill: pal.accent, strokeWidth: 0, z: 1, partType: 'Detail' }, tail.id);
  // legs
  const legShape = (len, w) => [[-w / 2, 0], [w / 2, 0], [w / 2 - 1, len - 6], [w / 2 + 4, len], [-w / 2 - 2, len], [-w / 2 + 1, len - 6]];
  const legY = bh * 0.3;
  const L = T.legs;
  if (T.quad) {
    add('LEG_BL', 'polygon', { x: L.back, y: legY, points: legShape(L.len, L.w), fill: shade(pal.primary, 0.18), z: -1, partType: 'Leg' }, body.id);
    add('LEG_FL', 'polygon', { x: L.front, y: legY, points: legShape(L.len, L.w), fill: shade(pal.primary, 0.18), z: -1, partType: 'Leg' }, body.id);
    add('LEG_BR', 'polygon', { x: L.back + 8, y: legY + 2, points: legShape(L.len - 2, L.w), fill: pal.primary, z: 1, partType: 'Leg' }, body.id);
    add('LEG_FR', 'polygon', { x: L.front + 8, y: legY + 2, points: legShape(L.len - 2, L.w), fill: pal.primary, z: 1, partType: 'Leg' }, body.id);
  } else {
    add('LEG_L', 'polygon', { x: L.back, y: legY + 4, points: legShape(L.len, L.w), fill: '#c9a26b', stroke: '#7a5433', z: -1, partType: 'Leg' }, body.id);
    add('LEG_R', 'polygon', { x: L.front, y: legY + 4, points: legShape(L.len, L.w), fill: '#d9b27b', stroke: '#7a5433', z: 1, partType: 'Leg' }, body.id);
  }
  // wings
  if (T.wings) {
    const wing = bodyType === 'avian'
      ? [[0, 0], [-22, -30], [-58, -40], [-70, -18], [-52, 2], [-20, 10]]
      : [[0, 0], [-16, -34], [-48, -46], [-40, -20], [-52, -4], [-18, 8]];
    add('WING_L', 'polygon', { x: -6, y: -bh * 0.25, points: wing, fill: shade(pal.secondary, 0.15), rotation: -8, z: -3, partType: 'Wing' }, body.id);
    add('WING_R', 'polygon', { x: 2, y: -bh * 0.2, points: wing, fill: pal.secondary, rotation: 4, z: 3, partType: 'Wing' }, body.id);
  }
  // belly / mane
  add('BELLY', 'ellipse', { x: 6, y: bh * 0.18, shape: { w: bw * 0.62, h: bh * 0.5 }, fill: pal.belly, strokeWidth: 0, z: 0.5, partType: 'Detail' }, body.id);
  if (T.mane) add('MANE', 'ellipse', { x: hx * 0.55, y: -bh * 0.12, shape: { w: bw * 0.5, h: bh * 1.1 }, fill: pal.belly, z: 3, partType: 'Mane' }, body.id);
  // head
  const head = add('HEAD', 'ellipse', { x: hx, y: hy, shape: { w: hw, h: hh }, pivotX: -hw * 0.3, pivotY: hh * 0.25, fill: pal.primary, z: 4, partType: 'Head' }, body.id);
  if (T.ear) {
    const [ew, eh] = T.ear;
    const earPts = [[-ew / 2, 0], [0, -eh], [ew / 2, 0]];
    add('EAR_L', 'polygon', { x: -hw * 0.18, y: -hh * 0.36, points: earPts, rotation: -14, fill: shade(pal.primary, 0.2), z: -1, partType: 'Ear' }, head.id);
    add('EAR_R', 'polygon', { x: hw * 0.16, y: -hh * 0.4, points: earPts, rotation: 10, fill: pal.secondary, z: 1, partType: 'Ear' }, head.id);
  }
  if (T.horns) {
    add('HORN_L', 'polygon', { x: -hw * 0.1, y: -hh * 0.4, points: [[-4, 0], [-6, -18], [4, -4]], fill: pal.belly, z: -1, partType: 'Horn' }, head.id);
    add('HORN_R', 'polygon', { x: hw * 0.16, y: -hh * 0.44, points: [[-4, 0], [-4, -20], [6, -2]], fill: pal.belly, z: 1, partType: 'Horn' }, head.id);
  }
  if (T.beak) {
    add('BEAK', 'polygon', { x: hw * 0.42, y: hh * 0.05, points: [[0, -5], [16, 2], [0, 7]], fill: '#f2b04a', stroke: '#8a5a10', z: 2, partType: 'Detail' }, head.id);
    add('CREST', 'polygon', { x: -hw * 0.1, y: -hh * 0.42, points: [[-6, 0], [-2, -16], [6, -6], [10, 0]], fill: pal.accent, z: -1, partType: 'Detail' }, head.id);
  }
  if (T.snout) add('SNOUT', 'ellipse', { x: hw * 0.4, y: hh * 0.12, shape: { w: T.snout[0], h: T.snout[1] }, fill: pal.belly, strokeWidth: 1.5, z: 2, partType: 'Snout' }, head.id);
  add('EYE', 'ellipse', { x: hw * 0.2, y: -hh * 0.1, shape: { w: 8, h: 9 }, fill: '#1c1f28', stroke: pal.eye, strokeWidth: 2, z: 3, partType: 'Eye' }, head.id);
  // anchors
  const anchor = (name, parentRole, x, y, color = '#f2c761') => add(name, 'anchor', { x, y, fill: color, z: 20, partType: 'Anchor' }, parts[parentRole]);
  anchor('Root', 'ROOT', 0, 0, '#ffffff');
  anchor('BodyCenter', 'BODY', 0, 0, '#60a5fa');
  anchor('Head', 'HEAD', 0, 0, '#60a5fa');
  anchor('Mouth', 'HEAD', hw * 0.5, hh * 0.18, '#f87171');
  anchor('AttackOrigin', 'HEAD', hw * 0.72, hh * 0.1, '#fb923c');
  anchor('VFXOrigin', 'BODY', hx * 0.45, -bh * 0.7, '#c084fc');
  anchor('TailBase', 'TAIL', 0, 0, '#4ade80');
  anchor('TailTip', 'TAIL', -T.tail.len, 0, '#4ade80');
  if (T.quad) { anchor('Foot_L', 'LEG_FL', 0, L.len, '#22d3ee'); anchor('Foot_R', 'LEG_FR', 0, L.len - 2, '#22d3ee'); }
  else { anchor('Foot_L', 'LEG_L', 0, L.len, '#22d3ee'); anchor('Foot_R', 'LEG_R', 0, L.len, '#22d3ee'); }
  if (T.wings) { anchor('Wing_L', 'WING_L', -40, -30, '#e879f9'); anchor('Wing_R', 'WING_R', -40, -30, '#e879f9'); }
  return { nodes, root, parts };
}

// ---------------------------------------------------------------- default animations (offsets from the rest pose)
function kf(t, o = {}) {
  return { t, x: o.x || 0, y: o.y || 0, rotation: o.r || 0, scaleX: o.sx == null ? 1 : o.sx, scaleY: o.sy == null ? 1 : o.sy, opacity: o.o == null ? 1 : o.o, ease: o.ease || 'easeInOut' };
}
function defaultAnimations(mythlingId, parts) {
  const P = (role) => parts[role];
  const has = (role) => !!parts[role];
  const legsQuad = has('LEG_FL');
  const legsL = legsQuad ? ['LEG_FL', 'LEG_BR'] : ['LEG_L'];
  const legsR = legsQuad ? ['LEG_FR', 'LEG_BL'] : ['LEG_R'];
  const mk = (name, duration, loop, tracksByRole, fps = 60) => {
    const tracks = {};
    for (const [role, keys] of Object.entries(tracksByRole)) if (has(role)) tracks[P(role)] = keys;
    return { id: uid('anim'), name, mythlingId, duration, loop, fps, easing: 'easeInOut', tracks };
  };
  const swing = (amp, dur, phase = 0) => [kf(0, { r: amp * phase }), kf(dur * 0.25, { r: amp }), kf(dur * 0.75, { r: -amp }), kf(dur, { r: amp * phase })];
  const walkLegs = (amp, dur) => Object.fromEntries([...legsL.map((r) => [r, [kf(0, { r: -amp }), kf(dur / 2, { r: amp }), kf(dur, { r: -amp })]]), ...legsR.map((r) => [r, [kf(0, { r: amp }), kf(dur / 2, { r: -amp }), kf(dur, { r: amp })]])]);
  const wingFlap = (amp, dur) => ({ WING_L: [kf(0, { r: -amp }), kf(dur / 2, { r: amp }), kf(dur, { r: -amp })], WING_R: [kf(0, { r: amp * 0.8 }), kf(dur / 2, { r: -amp * 0.8 }), kf(dur, { r: amp * 0.8 })] });

  m.terrain = new Array(m.cols * m.rows).fill(TERRAIN_INDEX[props.baseTerrain || 'grass']);

function mapAddNode(map, node, parentId = null) {

  node.parent = parentId;

  return node;
}

  const r0 = clamp(Math.floor(y / map.cell), 0, map.rows - 1), r1 = clamp(Math.ceil((y + h) / map.cell), 0, map.rows);
  for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) { map.terrain[r * map.cols + c] = ti; if (terrainId === 'water') map.collision[r * map.cols + c] = 2; else if (terrainId === 'cliff' || terrainId === 'lava') map.collision[r * map.cols + c] = 1; }
}

  // terrain painting
  paintCells(map, cells, terrainIdx, { collisionToo = true } = {}) {
    let changed = false;
    for (const [c, r] of cells) {
      if (c < 0 || r < 0 || c >= map.cols || r >= map.rows) continue;
      const i = r * map.cols + c;
      if (map.terrain[i] !== terrainIdx) { map.terrain[i] = terrainIdx; changed = true; }
      if (collisionToo) { const tid = TERRAINS[terrainIdx]?.id; if (tid === 'water') map.collision[i] = 2; else if (tid === 'cliff' || tid === 'lava') map.collision[i] = 1; else if (map.collision[i] === 2 || (map.collision[i] === 1 && (tid === 'grass' || tid === 'path' || tid === 'dirt' || tid === 'sand'))) map.collision[i] = 0; }

  brushCells(map, wx, wy, size) {

    const half = Math.floor(size / 2), out = [];
    for (let r = rr - half; r < rr - half + size; r++) for (let c = cc - half; c < cc - half + size; c++) out.push([c, r]);
    return out;
  },
  floodFill(map, wx, wy, terrainIdx, grid = map.terrain) {

        Ops.deleteNodes(); break;
      case 'enter': if (this.draft) this.finishDraft(); else if (E.selection.length) { UI.showRightTab('properties'); Right.focusName(); } break;
      case 'f2': if (E.selection.length) UI.renameSelected(); break;
      case 'f5': e.preventDefault(); Playtest.start(isCreatureMode() ? 'creature' : 'map'); break;
      case ' ': break;
      case 'arrowleft': case 'arrowright': case 'arrowup': case 'arrowdown': {
        e.preventDefault();
        if (E.mode === 'animation' && !E.selection.length && (k === 'arrowleft' || k === 'arrowright')) { Bottom.step(k === 'arrowleft' ? -1 : 1); break; }
        const step = (shift ? 10 : 1) * (settings().snap && !shift ? 1 : 1);
        const dx = k === 'arrowleft' ? -step : k === 'arrowright' ? step : 0, dy = k === 'arrowup' ? -step : k === 'arrowdown' ? step : 0;
        const nodes = selectedNodes().filter((n) => !n.locked); if (!nodes.length) break;
        History.run('~Nudge', () => { for (const n of nodes) { const [wx, wy] = worldPos(n); setWorldPosition(n, wx + dx, wy + dy); n.x = round(n.x, 2); n.y = round(n.y, 2); } });
        Right.syncTransform(); break;
      }
      case '[': if (E.tool === 'paint' || E.tool === 'collision') { E.brushSize = Math.max(1, [1, 2, 4, 8, 16].filter((b) => b < E.brushSize).pop() || 1); Left.render(); Scene.invalidate(); } else if (primarySelected()) Ops.reorder(primarySelected().id, -1); break;
      case ']': if (E.tool === 'paint' || E.tool === 'collision') { E.brushSize = [1, 2, 4, 8, 16].find((b) => b > E.brushSize) || 16; Left.render(); Scene.invalidate(); } else if (primarySelected()) Ops.reorder(primarySelected().id, 1); break;
      case '+': case '=': Scene.zoomBy(1.25); break;
      case '-': Scene.zoomBy(0.8); break;
      case '0': Scene.setZoom(1); break;
      case 'home': E.playhead = 0; invalidateMatrices(); Bottom.syncTransport(); Scene.invalidate(); break;
      case 'end': if (currentAnim()) { E.playhead = currentAnim().duration; invalidateMatrices(); Bottom.syncTransport(); Scene.invalidate(); } break;
      case ',': Bottom.step(-1); break;
      case '.': Bottom.step(1); break;
      case 'tab': e.preventDefault(); UI.cycleSelection(shift ? -1 : 1); break;
      default:
        if (/^[1-9]$/.test(k)) {
          if (E.tool === 'paint') { const t = TERRAINS[+k]; if (t) { E.terrain = t.id; Left.render(); Scene.invalidate(); } }
          else if (E.tool === 'collision') { const m = COLLISION_MODES[+k - 1]; if (m) { E.collisionMode = m.value; Left.render(); Scene.invalidate(); } }
          else if (isCreatureMode()) { const my = currentMythling(); const aid = my && my.animations[+k - 1]; if (aid) { UI.setAnimation(aid); E.playing = true; Bottom.syncTransport(); Scene.invalidate(); } }
        }
        return;
    }
    if (k !== 'tab') e.preventDefault();
  },
};

      const btn = h('button', { class: 'menu-btn', text: title });
      const dd = h('div', { class: 'dropdown hidden' });
      const wrap = h('div', { class: 'menu-wrap', style: { position: 'relative' } }, [btn, dd]);
      const open = () => { this.closeMenus(); this.renderDropdown(dd, items); dd.classList.remove('hidden'); btn.classList.add('open'); this.openMenu = { dd, btn }; };
      btn.addEventListener('click', (e) => { e.stopPropagation(); if (this.openMenu && this.openMenu.dd === dd) this.closeMenus(); else open(); });
      btn.addEventListener('mouseenter', () => { if (this.openMenu && this.openMenu.dd !== dd) open(); });
      root.appendChild(wrap);
    }
    document.addEventListener('mousedown', (e) => { if (this.openMenu && !e.target.closest('.menu-wrap')) this.closeMenus(); });
  },
  renderDropdown(dd, items) {
    clear(dd);
    for (const it of items) {
      if (it === 'sep') { dd.appendChild(h('div', { class: 'sep' })); continue; }

      const checked = it.checked && E.project ? it.checked() : false;
      const el = h('div', { class: `mi ${disabled ? 'disabled' : ''} ${it.sub ? 'has-sub' : ''}`, html: `<span class="chk">${checked ? '✓' : ''}</span><span class="lbl">${escapeHtml(it.label)}</span>${it.sc ? `<span class="sc">${it.sc}</span>` : ''}${it.sub ? '<span class="sc">▸</span>' : ''}` });
      if (it.sub && !disabled) {
        const sub = h('div', { class: 'dropdown sub hidden' });
        el.addEventListener('mouseenter', () => { const items2 = typeof it.sub === 'function' ? it.sub() : it.sub; this.renderDropdown(sub, items2.length ? items2 : [{ label: '(empty)', disabled: () => true }]); sub.classList.remove('hidden'); });
        el.addEventListener('mouseleave', () => sub.classList.add('hidden'));
        el.appendChild(sub);
      } else if (!disabled) el.addEventListener('click', (e) => { e.stopPropagation(); this.closeMenus(); try { it.fn && it.fn(); } catch (err) { console.error(err); toast(err.message, 'err'); } });
      dd.appendChild(el);

      if (F.json) add(`${slug(a.name)}.animation.json`, JSON.stringify(data, null, 2));

  async download(kind, itemId, F) {

  mapCanvas(map, maxW = 2048) {

    const w = [];
    const nodes = Object.values(map.nodes);
    if (!nodes.some((n) => n.type === 'spawn' && n.spawn.kind === 'player')) w.push(`Map "${map.name}": no player spawn point`);
    for (const n of nodes) {
      if (n.type === 'warp') { if (!n.warp.toMap) w.push(`Warp "${n.name}" has no destination map`); else if (!E.project.maps[n.warp.toMap]) w.push(`Warp "${n.name}" points to unknown map "${n.warp.toMap}"`); }
      if (n.type === 'zone') { if (!n.zone.species.length) w.push(`Zone "${n.zone.name}" has an empty species pool`); for (const s of n.zone.species) if (!E.project.mythlings[s]) w.push(`Zone "${n.zone.name}" references unknown species "${s}"`); if (n.zone.minLevel > n.zone.maxLevel) w.push(`Zone "${n.zone.name}": min level > max level`); }
      if (n.type === 'image' && n.asset && !E.project.assets[n.asset]) w.push(`Image "${n.name}" references a missing asset`);
      if (n.type === 'mythling' && !E.project.mythlings[n.mythling.species]) w.push(`Mythling placement "${n.name}" references unknown species "${n.mythling.species}"`);

  validateMythling(my) {
    const w = [];
    const nodes = Object.values(my.rig.nodes);
    const anchors = nodes.filter((n) => n.type === 'anchor').map((n) => n.name);
    for (const req of ['Root', 'Head', 'Mouth', 'AttackOrigin', 'VFXOrigin', 'BodyCenter']) if (!anchors.includes(req)) w.push(`${my.name}: missing anchor "${req}"`);

    for (const id of my.animations) if (!E.project.animations[id]) w.push(`${my.name}: animation id ${id} not found`);
    for (const id of my.vfx || []) if (!E.project.vfx[id]) w.push(`${my.name}: vfx id ${id} not found`);

      h('div', { class: 'start-cols' }, [

          h('button', { class: 'btn big', onclick: () => this.openFile(), title: 'Open a .json project file exported by MYTHLING EDIT (Ctrl+O)' }, [icon('folder'), ' OPEN PROJECT FILE']),
          h('button', { class: 'btn big', onclick: () => this.newProject({ demo: true }), title: 'Start from the bundled demo (Verdant Vale, Azure Coast, Emberwild + 5 template Mythlings)' }, [icon('sparkles'), ' NEW FROM DEMO CONTENT']),
          h('div', { class: 'hint', text: storageNote }),

      ]),

  },
  hideStart() { $('#start').classList.add('hidden'); },
  // ------------------------------------------------------------- project lifecycle
  async newProject(opts = {}) {
    if (E.project && E.dirty) { const ok = await confirmDialog('Unsaved Changes', 'You have unsaved changes. Save them before creating a new project?', 'SAVE & CONTINUE', 'DISCARD'); if (ok) await this.save(); }
    const body = h('div', { class: 'form-grid' });
    const st = { name: 'My Wildbound Project', demo: opts.demo ?? true, templates: true };
    body.append(fText('Project name', () => st.name, (v) => { st.name = v; }), fCheck('Include demo content (3 maps, demo NPCs, warps, zones)', () => st.demo, (v) => { st.demo = v; }), fCheck('Preload Mythling templates (Spriggo, Aquini, Emberu, Rivruff, Leaflet)', () => st.templates, (v) => { st.templates = v; }));
    const r = await dialog({ title: 'NEW PROJECT', body, buttons: [{ label: 'CANCEL', value: null }, { label: 'CREATE', value: 'ok', primary: true }] });
    if (r !== 'ok') return;
    let project;
    if (st.demo) { project = buildDemoProject(); project.project.name = st.name || 'Untitled'; project.project.id = uid('proj'); if (!st.templates) { for (const id of Object.keys(project.mythlings)) if (id !== 'spriggo') this.stripMythling(project, id); } }
    else { project = emptyProject(st.name || 'Untitled'); if (st.templates) { for (const key of Object.keys(SPECIES_TEMPLATES)) { const my = createMythlingFromTemplate(key); project.mythlings[my.id] = my; attachDefaultAnimations(project, my); } for (const v of defaultVFX()) project.vfx[v.id] = v; project.skills = defaultSkills(); } const m = newMap({ name: 'New Map', width: 1600, height: 1000 }); project.maps[m.id] = m; }

  },
  stripMythling(project, id) { const my = project.mythlings[id]; if (!my) return; for (const a of my.animations) delete project.animations[a]; delete project.mythlings[id]; for (const m of Object.values(project.maps)) for (const n of Object.values(m.nodes)) { if (n.type === 'mythling' && n.mythling.species === id) n.mythling.species = 'spriggo'; if (n.type === 'zone') n.zone.species = n.zone.species.filter((s) => s !== id); } },
  async openProjectId(id) {
    try {
      const data = await Store.loadProject(id);

      await this.loadIntoEditor(data);

    } catch (e) { ConsoleLog.error('Open failed: ' + e.message); toast('Could not open project: ' + e.message, 'err'); }
  },
  async openFile() {
    const file = await pickFile('.json,application/json'); if (!file) return;
    await this.importProjectFile(file);
  },
  async importProjectFile(file) {
    if (!file) { file = await pickFile('.json,application/json'); if (!file) return; }
    let text; try { text = await readAsText(file); } catch (e) { toast('Could not read file: ' + e.message, 'err'); return; }
    let data;
    try { data = JSON.parse(text); }
    catch (e) { const m = /position (\d+)/.exec(e.message); const pos = m ? +m[1] : -1; const line = pos >= 0 ? text.slice(0, pos).split('\n').length : '?'; await dialog({ title: 'INVALID JSON', body: h('div', {}, [h('p', { text: `The file "${file.name}" is not valid JSON.` }), h('pre', { class: 'ref', text: `${e.message}${pos >= 0 ? `\nLine ${line}, character ${pos}\n…${text.slice(Math.max(0, pos - 60), pos)}⟵HERE⟶${text.slice(pos, pos + 40)}…` : ''}` })]), buttons: [{ label: 'OK', value: 1, primary: true }] }); return; }
    if (!data || typeof data !== 'object') { toast('File does not contain a project object', 'err'); return; }
    // Accept single-item exports too (map / mythling) by merging into the current project
    if (!data.project && (data.nodes || data.rig) && E.project) { this.importItem(data, file.name); return; }
    if (!data.project) { data = { project: { id: uid('proj'), name: file.name.replace(/\.json$/i, ''), format: PROJECT_FORMAT_VERSION }, ...data }; }
    if (E.project && E.dirty) { const ok = await confirmDialog('Unsaved Changes', 'You have unsaved changes in the current project. Save them before opening?', 'SAVE & OPEN', 'DISCARD'); if (ok) await this.save(); }
    try {
      await this.loadIntoEditor(data);
      toast(`Imported "${E.project.project.name}"`, 'ok');
      await this.save();
    } catch (e) { ConsoleLog.error('Import failed: ' + e.message); toast('Import failed: ' + e.message, 'err'); if (!E.project) this.showStart(); }
  },
  importItem(data, fileName) {
    try {
      if (data.rig) { // mythling export
        const my = deepClone(data); my.id = E.project.mythlings[my.id] ? `${my.id}_${uid('').slice(-4)}` : my.id;
        const rigNodes = {}; for (const n of [...(my.rig.nodes || []), ...(my.rig.anchors || []).map((a) => ({ id: a.id, type: 'anchor', name: a.name, parent: a.parent, x: a.x, y: a.y, rotation: a.rotation, fill: a.color }))]) rigNodes[n.id] = normalizeNode(n);
        for (const n of Object.values(rigNodes)) if (n.parent && rigNodes[n.parent] && !rigNodes[n.parent].children.includes(n.id)) rigNodes[n.parent].children.push(n.id);
        my.rig = { nodes: rigNodes, root: Array.isArray(my.rig.root) && my.rig.root.length ? my.rig.root : Object.values(rigNodes).filter((n) => !n.parent).map((n) => n.id) };
        const animIds = []; for (const a of my.animations || []) { if (typeof a === 'string') { animIds.push(a); continue; } const clip = { id: a.id || uid('anim'), name: a.name, mythlingId: my.id, duration: a.duration, loop: a.loop, fps: a.fps, easing: a.easing, tracks: Object.fromEntries(Object.entries(a.tracks || {}).map(([id, t]) => [id, Array.isArray(t) ? t : t.keys])) }; E.project.animations[clip.id] = clip; animIds.push(clip.id); }
        my.animations = animIds;
        const vfxIds = []; for (const v of my.vfx || []) { if (typeof v === 'string') { vfxIds.push(v); continue; } E.project.vfx[v.id] = v; vfxIds.push(v.id); } my.vfx = vfxIds;
        History.run('Import Mythling', () => { E.project.mythlings[my.id] = my; });
        UI.openMythling(my.id); toast(`Imported Mythling "${my.name}" from ${fileName}`, 'ok');
      } else if (data.nodes && data.width) { // map export
        const map = newMap({ name: data.name, width: data.width, height: data.height, theme: data.theme, music: data.music, weather: data.weather, background: data.background, levelMin: data.levelMin, levelMax: data.levelMax });
        map.id = E.project.maps[data.id] ? `${data.id}_${uid('').slice(-4)}` : data.id || map.id;
        const dec = (g) => (g && g.encoding === 'rle' ? g.data.reduce((out, v, i, arr) => { if (i % 2 === 0) for (let k = 0; k < arr[i + 1]; k++) out.push(v); return out; }, []) : g);
        if (data.terrain) map.terrain = dec(data.terrain); if (data.collision) map.collision = dec(data.collision);
        if (data.layers) map.layers = data.layers; if (data.camera) map.camera = data.camera;
        map.nodes = {}; for (const n of data.nodes) map.nodes[n.id] = normalizeNode(n); map.root = data.root || Object.values(map.nodes).filter((n) => !n.parent).map((n) => n.id);
        History.run('Import map', () => { E.project.maps[map.id] = map; });
        UI.openMap(map.id); toast(`Imported map "${map.name}" from ${fileName}`, 'ok');
      } else if (data.nodes) { // object export
        const o = deepClone(data); o.id = o.id && !E.project.objects[o.id] ? o.id : uid('obj'); const nodes = {}; for (const n of o.nodes) nodes[n.id] = normalizeNode(n); o.nodes = nodes; o.root = o.root || Object.values(nodes).filter((n) => !n.parent).map((n) => n.id);
        History.run('Import object', () => { E.project.objects[o.id] = o; }); UI.showLeftTab('library'); toast(`Imported object "${o.name}"`, 'ok');
      } else toast('Unrecognised export file', 'warn');
    } catch (e) { ConsoleLog.error('Item import failed: ' + e.message); toast('Import failed: ' + e.message, 'err'); }
  },
  async loadIntoEditor(project, { fresh = false } = {}) {
    const fixes = migrateProject(project);
    if (fixes.length) { ConsoleLog.warn(`Project repaired on load (${fixes.length}): ${fixes.slice(0, 8).join('; ')}${fixes.length > 8 ? '…' : ''}`); }
    if (!Object.keys(project.maps).length) { const m = newMap({ name: 'New Map' }); project.maps[m.id] = m; }
    if (!project.snapshots) project.snapshots = [];
    E.project = project; E.dirty = false; E.playtest = null;
    History.undoStack.length = 0; History.redoStack.length = 0; History.pending = null;
    E.selection = []; E.selectedKey = null; E.hover = null; E.dragging = null; E.clipboard = null; E.keyClipboard = null; E.compare = null;
    AssetCache.clear();
    const firstMap = Object.keys(project.maps)[0];
    E.mapId = firstMap; E.mythlingId = Object.keys(project.mythlings)[0] || null; E.animId = null; E.vfxId = Object.keys(project.vfx)[0] || null; E.skillId = Object.keys(project.skills || {})[0] || null;
    E.tool = 'select'; E.playhead = 0; E.playing = false; E.ui.bottomShown = false; E.ui.leftTab = 'hierarchy'; E.ui.rightTab = 'properties';
    this.hideStart(); Screens.hide();
    if (!this.booted) this.bootUI();
    UI.setMode('map'); UI.refreshAll(); Scene.resize(); Scene.fit();
    document.title = `MYTHLING EDIT — ${project.project.name}`;
    this.scheduleAutosave();
    ConsoleLog.info(`${fresh ? 'Created' : 'Loaded'} project "${project.project.name}" (v${project.project.version}, ${Object.keys(project.maps).length} maps, ${Object.keys(project.mythlings).length} mythlings)`);
  },
  async closeProject() {
    if (E.dirty) { const ok = await confirmDialog('Close Project', 'Save changes before closing?', 'SAVE & CLOSE', 'DISCARD'); if (ok) await this.save(); }
    if (E.playtest) Playtest.stop();
    Screens.hide(); E.dirty = false; document.title = 'MYTHLING EDIT';
    this.showStart();
  },
  // ------------------------------------------------------------- save / autosave / snapshots
  async save(asCopy = false) {
    if (!E.project) return;
    const p = E.project;
    if (asCopy) { const name = await promptDialog('Save a Copy', 'Project name', p.project.name + ' copy'); if (!name) return; p.project.id = uid('proj'); p.project.name = name; p.project.created = nowIso(); p.project.version = 1; }
    p.project.version = (p.project.version || 0) + (E.dirty || asCopy ? 1 : 0);
    p.project.lastSaved = nowIso(); p.project.editorVersion = EDITOR_VERSION; p.project.format = PROJECT_FORMAT_VERSION;
    try {
      await Store.saveProject(p);
      E.dirty = false; E.lastSaveAt = Date.now(); await this.refreshRecent();
      UI.updateStatus(); UI.updateHeader();
      if (E.ui.leftTab === 'project') Left.render();
      toast(`Saved v${p.project.version}`, 'ok', 1400); ConsoleLog.ok(`Saved project v${p.project.version} (${p.project.changeCount || 0} changes)`);
    } catch (e) { ConsoleLog.error('Save failed: ' + e.message); toast('SAVE FAILED — ' + e.message, 'err', 6000); await dialog({ title: 'SAVE FAILED', body: h('div', {}, [h('p', { text: e.message }), h('p', { text: 'Use FILE → Export Project File to download a copy of your work.' })]), buttons: [{ label: 'EXPORT FILE NOW', value: 'x', primary: true }, { label: 'CLOSE', value: null }] }).then((r) => { if (r === 'x') Exporter.downloadProject(); }); }
  },
  scheduleAutosave() {
    clearInterval(this.autosaveTimer);
    this.autosaveTimer = setInterval(() => {
      if (!E.project) return;
      const secs = clamp(settings().autosaveSec ?? 30, 5, 600);
      if (E.dirty && Date.now() - (E.lastEditAt || 0) > 1500 && Date.now() - (E.lastSaveAt || 0) > secs * 1000 && !E.playtest && !E.dragging) { this.save(); ConsoleLog.info('Autosaved'); }
    }, 2000);
  },
  async saveSnapshot(label = '') {
    const p = E.project; if (!p) return;
    p.snapshots = p.snapshots || [];
    if (!label) { label = await promptDialog('Save Snapshot', 'Label', `v${p.project.version} — ${new Date().toLocaleString()}`); if (label == null) return; }
    p.snapshots.unshift({ label: label || `Snapshot ${p.snapshots.length + 1}`, version: p.project.version, at: nowIso(), changeCount: p.project.changeCount || 0, data: docSnapshot(p) });
    while (p.snapshots.length > 10) p.snapshots.pop();
    markDirty('Snapshot'); toast('Snapshot saved (max 10 kept)', 'ok'); ConsoleLog.info(`Snapshot "${p.snapshots[0].label}" saved`);
  },
  restoreSnapshot(s) {
    const p = E.project; if (!p) return;
    // keep the current state as a snapshot first (promised by the dialog), without bumping the change count noise
    p.snapshots = p.snapshots || [];
    p.snapshots.unshift({ label: `Before restore of "${s.label}"`, version: p.project.version, at: nowIso(), changeCount: p.project.changeCount || 0, data: docSnapshot(p) });
    while (p.snapshots.length > 10) p.snapshots.pop();
    History.run('Restore snapshot', () => { applyDocSnapshot(E.project, s.data); });
    afterHistoryJump(); UI.refreshAll(); toast(`Snapshot "${s.label}" restored (v${s.version}, ${fmtDate(s.at)})`, 'ok');
  },
  recentMenu() { return (E.recent || []).slice(0, 8).map((r) => ({ label: `${r.name}  —  v${r.version || 1}, ${fmtDate(r.lastSaved)}`, fn: () => this.openProjectId(r.id) })); },
  async refreshRecent() { try { E.recent = await Store.getKV('recent', []); } catch { E.recent = []; } },
  // ------------------------------------------------------------- content helpers used by menus
  addDemoContent() {
    const demo = buildDemoProject();
    History.run('Add demo content', () => {
      for (const [id, m] of Object.entries(demo.maps)) if (!E.project.maps[id]) E.project.maps[id] = m;
      for (const [id, my] of Object.entries(demo.mythlings)) if (!E.project.mythlings[id]) { E.project.mythlings[id] = my; for (const a of my.animations) E.project.animations[a] = demo.animations[a]; }
      for (const [id, v] of Object.entries(demo.vfx)) if (!E.project.vfx[id]) E.project.vfx[id] = v;
      for (const [id, s] of Object.entries(demo.skills)) if (!E.project.skills[id]) E.project.skills[id] = s;
      for (const [id, o] of Object.entries(demo.objects || {})) if (!E.project.objects[id]) E.project.objects[id] = o;
    });
    UI.refreshAll(); toast('Demo content added (existing items kept)', 'ok');
  },
  addTemplate(key) {
    const my = createMythlingFromTemplate(key);
    if (E.project.mythlings[my.id]) { my.id = `${my.id}_${uid('').slice(-4)}`; my.name += ' (copy)'; }
    History.run('Add template Mythling', () => { E.project.mythlings[my.id] = my; attachDefaultAnimations(E.project, my); });
    UI.openMythling(my.id); toast(`Template "${my.name}" added`, 'ok');
  },
  // ------------------------------------------------------------- boot
  bootUI() {
    this.booted = true;
    UI.init(); Scene.init(); Tools.init();
    window.addEventListener('beforeunload', (e) => { if (E.dirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('error', (e) => { ConsoleLog.error(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`); });
    window.addEventListener('unhandledrejection', (e) => { ConsoleLog.error('Unhandled: ' + (e.reason?.message || e.reason)); });
    // drag & drop files anywhere → images to assets, .json → project import
    document.addEventListener('dragover', (e) => { e.preventDefault(); });
    document.addEventListener('drop', async (e) => { if (e.target.closest('#scene')) return; e.preventDefault(); const files = [...(e.dataTransfer?.files || [])]; if (!files.length) return; const json = files.find((f) => /\.json$/i.test(f.name)); if (json) { await this.importProjectFile(json); return; } const imgs = files.filter((f) => /^image\//.test(f.type)); if (imgs.length) { await Ops.importImages(imgs); UI.showLeftTab('assets'); } });

      if (E.playtest) { if (e.key === 'Escape') { Playtest.stop(); e.preventDefault(); return; } Playtest.onKey(e, true); return; }
      if (e.key === 'F1') { e.preventDefault(); Screens.shortcuts(); return; }
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      const mod = e.ctrlKey || e.metaKey;
      // global shortcuts that must work even while a field has focus
      if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') { e.preventDefault(); this.save(); return; }
      if (mod && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); this.save(true); return; }
      if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); this.openFile(); return; }
      if (mod && e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); this.newProject(); return; }
      if (mod && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); if (E.project) UI.setMode('export'); return; }
      if (inField) { if (e.key === 'Escape') e.target.blur(); return; }
      if (document.querySelector('.overlay')) return; // a dialog is open: it handles its own keys
      Tools.onKey(e);
    });
    document.addEventListener('keyup', (e) => { if (E.playtest) { Playtest.onKey(e, false); return; } Tools.onKeyUp(e); });
  },
  async boot() {
    ConsoleLog.info(`MYTHLING EDIT v${EDITOR_VERSION} starting…`);
    try { await Store.init(); } catch (e) { ConsoleLog.warn('Storage init: ' + e.message); }
    await this.refreshRecent();
    const params = new URLSearchParams(location.search);
    const last = await Store.getKV('lastProject', null);
    if (params.get('fresh') !== '1' && last && (await Store.loadProject(last))) {
      // Offer the last project directly (fast path) but still show the start screen for choice
    }
    if (!E.recent.length && params.get('fresh') !== '1') {
      // First open ever: build the demo project so the user immediately has content to explore
      const project = buildDemoProject();
      await this.loadIntoEditor(project, { fresh: true });
      await this.save();
      toast('Welcome! A demo project was created for you (Verdant Vale, Spriggo & friends).', 'ok', 5000);
      setTimeout(() => Screens.guide(), 600);

    }
    await this.showStart();
  },
